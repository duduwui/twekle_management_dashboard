# Plain Spring MVC: these properties are consumed explicitly by JpaConfig/WebMvcConfig.
# Local development defaults. Supply database credentials through environment in deployment.
database.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/twekl_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
database.username=${DB_USERNAME:twekl_user}
database.password=${DB_PASSWORD:twekl_pass_2026}
database.pool.maximum=${DB_POOL_MAX:15}
database.pool.minimum=${DB_POOL_MIN:5}
database.schema-action=${DB_SCHEMA_ACTION:validate}
thymeleaf.cache=${THYMELEAF_CACHE:true}
# Demo records and the demo administrator are never seeded unless explicitly enabled.
# Enable with -Dspring.profiles.active=demo only for an isolated demonstration database.
