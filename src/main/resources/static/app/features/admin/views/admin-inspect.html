
                    <!-- 1.3 INSPECT ADMIN PAGE -->
                    <div ng-show="adminView === 'inspect'" style="display: flex; flex-direction: column; gap: 18px;">
                        <div class="action-page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <button type="button" class="back-btn" ng-click="setAdminView('list')">
                                    ← Back to Admins List
                                </button>
                                <button type="button" class="comic-btn" ng-click="setAdminView('create')">
                                    + Create Admin
                                </button>
                            </div>

                            <div style="display: flex; align-items: center; gap: 8px;" ng-if="selectedAdmin">
                                <span style="font-size: 0.82rem; font-weight: 800; color: var(--text-muted);">Switch Admin:</span>
                                <select class="comic-input" 
                                        style="width: 180px; padding: 5px 10px; font-size: 0.82rem;" 
                                        ng-model="selectedAdmin" 
                                        ng-options="a as a.username for a in admins track by a.id"
                                        ng-change="setAdminView('inspect', selectedAdmin)">
                                </select>
                            </div>
                        </div>

                        <!-- Admin Profile & Permissions Detail Card -->
                        <div class="inspect-card" ng-if="selectedAdmin">
                            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-black); padding-bottom: 14px;">
                                <div>
                                    <div style="font-size: 0.78rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Administrator Profile</div>
                                    <h2 style="font-size: 1.35rem; font-weight: 900; color: var(--text-main); margin: 3px 0 0 0;" ng-bind="selectedAdmin.username"></h2>
                                </div>
                                <div style="display: flex; gap: 8px; align-items: center;">
                                    <span class="comic-tag" ng-class="selectedAdmin.superAdmin ? 'tag-primary' : 'tag-muted'">
                                        <span ng-if="selectedAdmin.superAdmin">Super Admin</span>
                                        <span ng-if="!selectedAdmin.superAdmin">Standard Admin</span>
                                    </span>
                                    <span class="comic-tag" ng-class="selectedAdmin.status === 'ACTIVE' ? 'tag-primary' : 'tag-muted'" ng-bind="selectedAdmin.status"></span>
                                </div>
                            </div>

                            <!-- Admin Details Grid -->
                            <div class="detail-grid-3">
                                <div class="detail-item">
                                    <span class="detail-item-label">Username</span>
                                    <strong class="detail-item-value" ng-bind="selectedAdmin.username"></strong>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-item-label">Phone Number</span>
                                    <span class="detail-item-value" ng-bind="selectedAdmin.phoneNumber || 'None'"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-item-label">Account Status</span>
                                    <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                                        <label class="comic-switch">
                                            <input type="checkbox" ng-checked="selectedAdmin.status === 'ACTIVE'" ng-click="toggleAdminStatus(selectedAdmin, $event)">
                                            <span class="comic-slider"></span>
                                        </label>
                                        <strong style="font-size: 0.88rem;" ng-bind="selectedAdmin.status"></strong>
                                    </div>
                                </div>
                            </div>

                            <!-- Admin System Privileges & Capabilities -->
                            <div style="background-color: #F8FAFC; border: 2px solid var(--border-black); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
                                <div style="font-size: 0.85rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px;">
                                    Administrative Capabilities & System Permissions
                                </div>
                                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;">
                                    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 2px solid var(--border-black); border-radius: 8px; padding: 12px 14px; box-shadow: 2px 2px 0px var(--border-black);">
                                        <div class="crud-unified-badge active" style="font-size: 0.82rem;">SA</div>
                                        <div>
                                            <div style="font-size: 0.76rem; font-weight: 700; color: var(--text-muted);">Super Administrator</div>
                                            <strong style="font-size: 0.88rem;" ng-style="{'color': selectedAdmin.superAdmin ? 'var(--primary-dark)' : 'var(--text-muted)'}" ng-bind="selectedAdmin.superAdmin ? 'Yes (Full System Access)' : 'No (Standard Access)'"></strong>
                                        </div>
                                    </div>

                                    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 2px solid var(--border-black); border-radius: 8px; padding: 12px 14px; box-shadow: 2px 2px 0px var(--border-black);">
                                        <div class="crud-unified-badge" style="font-size: 0.82rem;">RM</div>
                                        <div>
                                            <div style="font-size: 0.76rem; font-weight: 700; color: var(--text-muted);">Role Management</div>
                                            <strong style="font-size: 0.88rem;" ng-style="{'color': (selectedAdmin.canCreateRoles || selectedAdmin.superAdmin) ? 'var(--primary-dark)' : 'var(--text-muted)'}" ng-bind="(selectedAdmin.canCreateRoles || selectedAdmin.superAdmin) ? 'Granted (Create/Edit Roles)' : 'Restricted'"></strong>
                                        </div>
                                    </div>

                                    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 2px solid var(--border-black); border-radius: 8px; padding: 12px 14px; box-shadow: 2px 2px 0px var(--border-black);">
                                        <div class="crud-unified-badge" style="font-size: 0.82rem;">UM</div>
                                        <div>
                                            <div style="font-size: 0.76rem; font-weight: 700; color: var(--text-muted);">User Management</div>
                                            <strong style="font-size: 0.88rem;" ng-style="{'color': (selectedAdmin.canManageUsers || selectedAdmin.superAdmin) ? 'var(--primary-dark)' : 'var(--text-muted)'}" ng-bind="(selectedAdmin.canManageUsers || selectedAdmin.superAdmin) ? 'Granted (Manage Users & Perms)' : 'Restricted'"></strong>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Card Action Buttons -->
                            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 4px;">
                                <button type="button" class="comic-btn-secondary" ng-click="setAdminView('list')">← Back to Admins List</button>
                                <button type="button" class="comic-btn-danger" ng-click="confirmDeleteAdminModal(selectedAdmin)">Delete Administrator</button>
                            </div>
                        </div>
                    </div>
