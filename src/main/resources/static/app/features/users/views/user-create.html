                    <!-- 2.1 CREATE USER + CRUD MODULE PERMISSIONS PAGE -->
                    <div ng-show="userView === 'create'" style="display: flex; flex-direction: column; gap: 22px;">
                        
                        <!-- 1. Multilingual Names & User Credentials Box -->
                        <div class="comic-form-box">
                            <div style="font-size: 1.05rem; font-weight: 900; color: #000000; margin-bottom: 2px;">
                                1. User Profile & Multilingual Names
                            </div>
                            
                            <!-- Multilingual Name Inputs: English, Arabic, Kurdish -->
                            <div class="form-grid-3">
                                <div class="form-group">
                                    <label class="form-label">English Username / Name <span style="color: #DC2626;">*</span></label>
                                    <input type="text" class="comic-input" placeholder="e.g. aryan_tech" ng-model="newUser.usernameEn" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Arabic Name (الاسم بالعربية)</label>
                                    <input type="text" class="comic-input" placeholder="مثال: أريان محمود" dir="rtl" ng-model="newUser.usernameAr">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Kurdish Name (ناوی بە کوردی)</label>
                                    <input type="text" class="comic-input" placeholder="وەک: ئاریان مەحمود" dir="rtl" ng-model="newUser.usernameKu">
                                </div>
                            </div>

                            <div class="form-grid-3" style="margin-top: 10px;">
                                <div class="form-group">
                                    <label class="form-label">Account Password <span style="color: #DC2626;">*</span></label>
                                    <input type="password" class="comic-input" placeholder="••••••••" ng-model="newUser.password" required>
                                </div>
                            </div>
                        </div>


                        <!-- 2. 3-Module CRUD Matrix -->
                        <div>
                            <div style="font-size: 1.05rem; font-weight: 900; color: #000000; margin-bottom: 12px;">
                                2. Module Permissions Matrix (Configure Direct Switches)
                            </div>
                            <div class="module-cards-grid">
                                <div class="comic-module-card" ng-repeat="mod in createFormModules track by mod.moduleKey">
                                    <div class="module-card-header">
                                        <div class="module-title-group">
                                            <h3 class="module-title" style="color: #000000; font-weight: 900;" ng-bind="mod.moduleNameEn"></h3>
                                        </div>
                                    </div>

                                    <p class="module-desc" style="color: #334155; font-weight: 600;" ng-bind="mod.descriptionEn"></p>

                                    <!-- 4 Direct CRUD Switches -->
                                    <div class="crud-switches-box">
                                        <div class="crud-switch-row">
                                            <div class="crud-switch-label" style="color: #000000; font-weight: 800;">
                                                <span class="crud-unified-badge" ng-class="{'active': mod.canCreate}">C</span>
                                                <span>Create</span>
                                            </div>
                                            <label class="comic-switch">
                                                <input type="checkbox" ng-checked="mod.canCreate" ng-click="toggleCreateModuleField(mod, 'canCreate')">
                                                <span class="comic-slider"></span>
                                            </label>
                                        </div>

                                        <div class="crud-switch-row">
                                            <div class="crud-switch-label" style="color: #000000; font-weight: 800;">
                                                <span class="crud-unified-badge" ng-class="{'active': mod.canRead}">R</span>
                                                <span>Read</span>
                                            </div>
                                            <label class="comic-switch">
                                                <input type="checkbox" ng-checked="mod.canRead" ng-click="toggleCreateModuleField(mod, 'canRead')">
                                                <span class="comic-slider"></span>
                                            </label>
                                        </div>

                                        <div class="crud-switch-row">
                                            <div class="crud-switch-label" style="color: #000000; font-weight: 800;">
                                                <span class="crud-unified-badge" ng-class="{'active': mod.canUpdate}">U</span>
                                                <span>Update</span>
                                            </div>
                                            <label class="comic-switch">
                                                <input type="checkbox" ng-checked="mod.canUpdate" ng-click="toggleCreateModuleField(mod, 'canUpdate')">
                                                <span class="comic-slider"></span>
                                            </label>
                                        </div>

                                        <div class="crud-switch-row">
                                            <div class="crud-switch-label" style="color: #000000; font-weight: 800;">
                                                <span class="crud-unified-badge" ng-class="{'active': mod.canDelete}">D</span>
                                                <span>Delete</span>
                                            </div>
                                            <label class="comic-switch">
                                                <input type="checkbox" ng-checked="mod.canDelete" ng-click="toggleCreateModuleField(mod, 'canDelete')">
                                                <span class="comic-slider"></span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="module-quick-actions">
                                        <button type="button" class="preset-btn" style="color: #000000; font-weight: 800;" ng-click="setCreateFormFullCrud(mod)">Full CRUD</button>
                                        <button type="button" class="preset-btn" style="color: #000000; font-weight: 800;" ng-click="setCreateFormReadOnly(mod)">Read Only</button>
                                        <button type="button" class="preset-btn-danger" ng-click="setCreateFormRevoke(mod)">Revoke</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Action -->
                        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px;">
                            <button type="button" class="comic-btn-secondary" ng-click="setUserView('list')">Cancel & Return</button>
                            <button type="button" class="comic-btn" ng-click="createUser()">Save & Create User</button>
                        </div>

                    </div>
