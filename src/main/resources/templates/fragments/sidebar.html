<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar">
    <div class="brand-section">
        <img src="/images/twekl-logo.png" alt="Twekl Logo" class="brand-logo-img">
        <div class="brand-info">
            <span class="brand-title">Twekl</span>
            <span class="brand-subtitle">Management</span>
        </div>
    </div>

    <div class="nav-section">
        <span class="nav-label">Navigation</span>
        
        <!-- Group 1: Administration Category Accordion -->
        <div class="nav-category-group">
            <button type="button" 
                    class="nav-category-toggle" 
                    ng-class="{'active-category': currentTab === 'admins' || currentTab === 'users'}"
                    ng-click="toggleCategory('admin')">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="category-arrow" ng-class="{'expanded': isCategoryOpen('admin')}">▶</span>
                    <span>Administration</span>
                </div>
                <span class="nav-badge" ng-bind="admins.length + users.length">0</span>
            </button>

            <!-- Administration 2 Sub-tabs -->
            <div class="nav-sub-items" ng-show="isCategoryOpen('admin')">
                <button type="button" 
                        class="nav-sub-item" 
                        ng-class="{'active': currentTab === 'admins'}" 
                        ng-click="setTab('admins')">
                    <span>Admin Management</span>
                    <span class="nav-badge-sm" ng-bind="admins.length">0</span>
                </button>

                <button type="button" 
                        class="nav-sub-item" 
                        ng-class="{'active': currentTab === 'users'}" 
                        ng-click="setTab('users')">
                    <span>Users & Permissions</span>
                    <span class="nav-badge-sm" ng-bind="users.length">0</span>
                </button>
            </div>
        </div>

        <div class="nav-divider"></div>

        <!-- Group 2: Follow-ups -->
        <button type="button" 
                class="nav-item" 
                ng-class="{'active': currentTab === 'customers'}" 
                ng-click="setTab('customers')">
            <span>Follow-ups</span>
            <span class="nav-badge" ng-bind="customers.length">0</span>
        </button>

        <div class="nav-divider"></div>

        <!-- Group 3: Reports Accordion -->
        <div class="nav-category-group">
            <button type="button"
                    class="nav-category-toggle"
                    ng-class="{'active-category': currentTab === 'reports'}"
                    ng-click="toggleCategory('reports')">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="category-arrow" ng-class="{'expanded': isCategoryOpen('reports')}">▶</span>
                    <span>Reports</span>
                </div>
                <span class="nav-badge" ng-bind="reportData.summary.totalFollowupsDue || 0">0</span>
            </button>

            <!-- Reports 4 Sub-tabs -->
            <div class="nav-sub-items" ng-show="isCategoryOpen('reports')">
                <button type="button"
                        class="nav-sub-item"
                        ng-class="{'active': currentTab === 'reports' && reportSubTab === 'milestones'}"
                        ng-click="setTab('reports'); setReportSubTab('milestones')">
                    <span>Follow-ups &amp; Milestones</span>
                </button>
                <button type="button"
                        class="nav-sub-item"
                        ng-class="{'active': currentTab === 'reports' && reportSubTab === 'satisfaction'}"
                        ng-click="setTab('reports'); setReportSubTab('satisfaction')">
                    <span>Satisfaction &amp; Notes</span>
                </button>
                <button type="button"
                        class="nav-sub-item"
                        ng-class="{'active': currentTab === 'reports' && reportSubTab === 'products'}"
                        ng-click="setTab('reports'); setReportSubTab('products')">
                    <span>Product Insights</span>
                </button>
                <button type="button"
                        class="nav-sub-item"
                        ng-class="{'active': currentTab === 'reports' && reportSubTab === 'customers'}"
                        ng-click="setTab('reports'); setReportSubTab('customers')">
                    <span>Customer Directory</span>
                </button>
            </div>
        </div>

        <div class="nav-divider"></div>

        <!-- Group 4: Time Filters (Dedicated Tab) -->
        <button type="button" 
                class="nav-item" 
                ng-class="{'active': currentTab === 'time-filters'}" 
                ng-click="setTab('time-filters')">
            <span>Time Filters</span>
            <span class="nav-badge" ng-bind="timeFilterPresets.length">0</span>
        </button>
    </div>

    <!-- Sidebar Bottom User Profile / Credentials -->
    <div class="sidebar-footer" ng-if="auth.authenticated">
        <div class="sidebar-user-card">
            <div class="sidebar-user-details">
                <span class="sidebar-user-name" ng-bind="auth.username"></span>
                <span class="sidebar-user-role" ng-bind="auth.role"></span>
            </div>
            <button type="button" class="sidebar-logout-btn" ng-click="logout()" title="Logout">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span>Logout</span>
            </button>
        </div>
    </div>
    <div class="sidebar-footer" ng-if="!auth.authenticated">
        <button type="button" class="sidebar-login-btn" ng-click="openLoginModal()">
            <span>Log In</span>
        </button>
    </div>
</aside>
</body>
</html>
