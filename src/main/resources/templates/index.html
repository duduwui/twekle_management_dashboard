<!DOCTYPE html>
<html lang="en" ng-app="tweklApp" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body ng-controller="LayoutController" ng-cloak>

    <div class="app-container">
        <!-- Sidebar Navigation Fragment (Clean - No Badge Numbers) -->
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <!-- Main Content Wrapper -->
        <div class="main-wrapper">
            <!-- Top Header Fragment -->
            <header th:replace="~{fragments/header :: header}"></header>

            <!-- Page Body (Micro-Modular Feature Tabs) -->
            <main class="page-body">
                <!-- Tab 1: Admin Management -->
                <div th:replace="~{fragments/admin-tab :: adminTab}"></div>

                <!-- Tab 2: Users & Permissions -->
                <div th:replace="~{fragments/users-tab :: usersTab}"></div>

                <!-- Tab 3: Follow-ups / Customers -->
                <div th:replace="~{fragments/customers-tab :: customersTab}"></div>

                <!-- Tab 4: Time Filters -->
                <div th:replace="~{fragments/time-filters-tab :: timeFiltersTab}"></div>

                <!-- Tab 5: Reports -->
                <div th:replace="~{fragments/reports-tab :: reportsTab}"></div>
            </main>
        </div>
    </div>

    <!-- All Modals Fragment (Delete, Follow-up Edit, Extra Filters, Login, Toasts) -->
    <div th:replace="~{fragments/modals :: modals}"></div>

    <!-- Scripts Fragment -->
    <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
