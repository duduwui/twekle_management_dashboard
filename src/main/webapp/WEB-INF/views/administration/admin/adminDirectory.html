<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="adminDirectory" id="adminListSection" style="display: flex; flex-direction: column; gap: 16px;">
    <!-- Section Header -->
    <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px;">
        <h2 class="card-title" style="margin: 0;">Staff Administrators</h2>
        <span class="card-subtitle" style="font-size: 0.88rem; color: var(--text-muted); font-weight: 600;">
            Manage administrative accounts, assign role templates, and configure direct module privileges.
        </span>
    </div>

    <!-- Clean Admin Toolbar (+ Create Admin & Client-side Filter) -->
    <div class="comic-filter-toolbar">
        <div class="filter-left-controls">
            <button type="button" class="comic-btn-sm" onclick="showCreateAdminSection()">
                + Create Admin
            </button>
        </div>

        <!-- Fast Filter Input -->
        <div class="filter-search-box">
            <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="adminSearchInput" class="comic-search-bar" placeholder="Filter administrators..." oninput="filterAdminTable()">
        </div>
    </div>

    <!-- Server-Side Rendered Admins Table -->
    <div class="table-responsive">
        <table class="comic-table" id="adminTable">
            <thead>
                <tr>
                    <th>Username</th>
                    <th class="col-phone nowrap">Phone Number</th>
                    <th>Admin Level</th>
                    <th>Status</th>
                    <th style="text-align: right; width: 220px;" class="nowrap">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="admin : ${admins}" class="admin-row"
                    th:data-admin-id="${admin.id}"
                    th:data-username="${admin.username}"
                    th:data-phone="${admin.phoneNumber}"
                    th:data-super-admin="${admin.superAdmin}">
                    <td><strong th:text="${admin.username}" style="color: var(--primary-dark); font-size: 0.95rem;">username</strong></td>
                    <td class="col-phone nowrap">
                        <span style="color: var(--text-muted); white-space: nowrap; font-weight: 700;" th:text="${admin.phoneNumber != null and !admin.phoneNumber.isEmpty() ? admin.phoneNumber : '-'}">-</span>
                    </td>
                    <td>
                        <span class="comic-tag" th:classappend="${admin.superAdmin} ? 'tag-primary' : 'tag-muted'">
                            <span th:if="${admin.superAdmin}">Super Admin</span>
                            <span th:unless="${admin.superAdmin}">Administrator</span>
                        </span>
                    </td>
                    <td>
                        <form th:action="@{/admin/admins/{adminId}/toggle-status(adminId=${admin.id})}" method="post" style="display: inline-flex; align-items: center; margin: 0;">
                            <button type="submit" class="status-pill-btn" th:classappend="${admin.active} ? 'active' : 'inactive'" th:title="'Click to toggle status'">
                                <span class="status-dot"></span>
                                <span th:text="${admin.active} ? 'Active' : 'Inactive'">Active</span>
                            </button>
                        </form>
                    </td>
                    <td style="text-align: right;">
                        <div style="display: inline-flex; gap: 8px; align-items: center;">
                            <form th:action="@{/admin/admins/{adminId}/delete-admin(adminId=${admin.id})}" method="post" style="display: inline; margin: 0;" onsubmit="return confirm('Are you sure you want to delete administrator \'' + this.getAttribute('data-uname') + '\'?');" th:data-uname="${admin.username}">
                                <button type="submit" class="comic-btn-danger" style="cursor: pointer;">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(admins)}">
                    <td colspan="5" style="text-align: center; padding: 28px; color: var(--text-muted); font-weight: 800;">
                        No administrators registered yet.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Footer summary -->
    <div class="datatable-footer" th:if="${!#lists.isEmpty(admins)}">
        <div class="datatable-info">
            Total Registered Administrators: <strong th:text="${#lists.size(admins)}">0</strong>
        </div>
    </div>
</div>
</body>
</html>
