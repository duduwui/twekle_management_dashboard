<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="adminForm" id="createAdminSection" style="display: none; flex-direction: column; gap: 20px;">
    <div class="action-page-header">
        <button type="button" class="back-btn" onclick="hideCreateAdminSection()">
            ← Back to Admins List
        </button>
    </div>

    <form th:action="@{/admin/admins/create-admin}" method="post" class="comic-form-box" autocomplete="off">
        
        <div style="font-size: 1.05rem; font-weight: 900; color: #000000; margin-bottom: 12px;">
            1. Account Credentials &amp; Level
        </div>

        <div class="form-grid-3">
            <div class="form-group">
                <label class="form-label">Username <span style="color: #EF4444;">*</span></label>
                <input type="text" name="username" class="comic-input" placeholder="e.g. ops_manager" required autocomplete="off">
            </div>
            <div class="form-group">
                <label class="form-label">Password <span style="color: #EF4444;">*</span></label>
                <input type="password" name="password" class="comic-input" placeholder="••••••••" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phoneNumber" class="comic-input" placeholder="+966 50 123 4567" autocomplete="off">
            </div>
        </div>

        <!-- Super Administrator Switch Banner -->
        <div style="margin-top: 14px; background: #EEF2FF; border: 1.5px solid #C7D2FE; border-radius: 8px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <label class="comic-switch">
                    <input type="checkbox" name="superAdmin" id="createIsSuperAdmin" value="true" onchange="toggleCreateSuperAdmin(this.checked)">
                    <span class="comic-slider"></span>
                </label>
                <div>
                    <strong style="color: #1E1B4B; font-size: 0.95rem;">Super Administrator Account</strong>
                    <div style="font-size: 0.8rem; color: #4338CA; font-weight: 600;">Grants unrestricted full CRUD privileges across all 3 modules and portal controls.</div>
                </div>
            </div>
            <span class="comic-tag tag-primary" id="superAdminStatusBadge" style="display: none;">SUPER ADMIN</span>
        </div>

        <!-- Active Status Switch Banner -->
        <div style="margin-top: 14px; background: #F8FAFC; border: 1.5px solid #CBD5E1; border-radius: 8px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <label class="comic-switch">
                    <input type="checkbox" name="active" value="true" checked>
                    <span class="comic-slider"></span>
                </label>
                <div>
                    <strong style="color: #0F172A; font-size: 0.95rem;">Active Account</strong>
                    <div style="font-size: 0.8rem; color: #64748B; font-weight: 600;">Enable or disable immediate login access for this administrator.</div>
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
            <button type="button" class="comic-btn-secondary" onclick="hideCreateAdminSection()">Cancel</button>
            <button type="submit" class="comic-btn">Save &amp; Create Administrator</button>
        </div>
    </form>
</div>
</body>
</html>
