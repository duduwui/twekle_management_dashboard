<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Staff Admins &amp; Permissions | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
    <section class="comic-card page-slide-fade">
        
        <!-- SSR Flash Messages -->
        <div th:if="${successMessage}" class="comic-alert-success" style="margin-bottom: 16px; padding: 12px 16px; background-color: #ECFDF5; border: 2px solid #059669; border-radius: 8px; color: #065F46; font-weight: 700;" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="comic-alert-danger" style="margin-bottom: 16px; padding: 12px 16px; background-color: #FEF2F2; border: 2px solid #DC2626; border-radius: 8px; color: #991B1B; font-weight: 700;" th:text="${errorMessage}"></div>

        <!-- 1.1 Admin List Section -->
        <div th:replace="~{administration/admin/fragments/admin-table :: adminTable}"></div>

        <!-- 1.2 Create Admin Section -->
        <div th:replace="~{administration/admin/fragments/admin-create-form :: adminCreateForm}"></div>

        <!-- 1.3 Inspect Admin Modal -->
        <div th:replace="~{administration/admin/fragments/admin-inspect-modal :: adminInspectModal}"></div>

    </section>

    <!-- Client-Side Script Fragment -->
    <div th:replace="~{administration/admin/fragments/admin-scripts :: adminScripts}"></div>
    </div>
</body>
</html>
