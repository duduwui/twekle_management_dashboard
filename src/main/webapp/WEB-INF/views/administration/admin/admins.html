<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Staff Admins | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
    <section class="comic-card page-slide-fade">
        
        <!-- SSR Flash Messages -->
        <div th:if="${successMessage}" class="comic-alert-success" style="margin-bottom: 16px; padding: 12px 16px; background-color: #ECFDF5; border: 2px solid #059669; border-radius: 8px; color: #065F46; font-weight: 700;" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="comic-alert-danger" style="margin-bottom: 16px; padding: 12px 16px; background-color: #FEF2F2; border: 2px solid #DC2626; border-radius: 8px; color: #991B1B; font-weight: 700;" th:text="${errorMessage}"></div>

        <!-- 1.1 ADMIN LIST VIEW -->
        <div id="adminListSection" style="display: flex; flex-direction: column; gap: 16px;">
            
            <!-- Clean Admin Toolbar (+ Create Admin & Client-side Filter) -->
            <div class="comic-filter-toolbar">
                <div class="filter-left-controls">
                    <button type="button" class="comic-btn-sm" onclick="document.getElementById('adminListSection').style.display='none'; document.getElementById('createAdminSection').style.display='flex';">
                        + Create Admin
                    </button>
                </div>

                <!-- Fast Filter Input -->
                <div class="filter-search-box">
                    <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="search" id="adminSearchInput" class="comic-search-bar" placeholder="Filter administrators..." oninput="filterAdminTable()">
                </div>
            </div>

            <!-- Server-Side Rendered Admins Table -->
            <div class="table-responsive">
                <table class="comic-table" id="adminTable">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th class="col-phone nowrap">Phone Number</th>
                            <th>Admin Level</th>
                            <th>Status</th>
                            <th style="text-align: right;" class="nowrap">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="admin : ${adminList}" class="admin-row">
                            <td><strong th:text="${admin.username}">username</strong></td>
                            <td class="col-phone nowrap">
                                <span style="color: var(--text-muted); white-space: nowrap;" th:text="${admin.phoneNumber != null and !admin.phoneNumber.isEmpty() ? admin.phoneNumber : '-'}">-</span>
                            </td>
                            <td>
                                <span class="comic-tag" th:classappend="${admin.superAdmin} ? 'tag-primary' : 'tag-muted'">
                                    <span th:if="${admin.superAdmin}">Super Admin</span>
                                    <span th:unless="${admin.superAdmin}">Administrator</span>
                                </span>
                            </td>
                            <td>
                                <form th:action="@{/admin/admins/{adminId}/toggle-status(adminId=${admin.adminId})}" method="post" style="display: inline-flex; align-items: center; gap: 8px; margin: 0;">
                                    <button type="submit" class="comic-tag" th:classappend="${admin.active} ? 'tag-primary' : 'tag-muted'" style="cursor: pointer; border: 1.5px solid var(--border-black); background: none;" th:title="'Click to toggle status'" th:text="${admin.active} ? 'Active' : 'Inactive'">Active</button>
                                </form>
                            </td>
                            <td style="text-align: right;">
                                <form th:action="@{/admin/admins/{adminId}/delete-admin(adminId=${admin.adminId})}" method="post" style="display: inline; margin: 0;" onsubmit="return confirm('Are you sure you want to delete this administrator?');">
                                    <button type="submit" class="comic-btn-danger" style="cursor: pointer;">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(adminList)}">
                            <td colspan="5" style="text-align: center; padding: 28px; color: var(--text-muted); font-weight: 800;">
                                No administrators registered yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Footer summary -->
            <div class="datatable-footer" th:if="${!#lists.isEmpty(adminList)}">
                <div class="datatable-info">
                    Total Registered Administrators: <strong th:text="${#lists.size(adminList)}">0</strong>
                </div>
            </div>
        </div>

        <!-- 1.2 CREATE ADMIN SSR VIEW -->
        <div id="createAdminSection" style="display: none; flex-direction: column; gap: 22px;">
            <div class="action-page-header">
                <button type="button" class="back-btn" onclick="document.getElementById('createAdminSection').style.display='none'; document.getElementById('adminListSection').style.display='flex';">
                    ← Back to Admins List
                </button>
            </div>

            <form th:action="@{/admin/admins/create-admin}" method="post" class="comic-form-box" style="max-width: 800px;" autocomplete="off">
                <div class="form-grid-3">
                    <div class="form-group">
                        <label class="form-label">Username <span style="color: #EF4444;">*</span></label>
                        <input type="text" name="username" class="comic-input" placeholder="e.g. ops_manager" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password <span style="color: #EF4444;">*</span></label>
                        <input type="password" name="password" class="comic-input" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phoneNumber" class="comic-input" placeholder="+966 50 123 4567" autocomplete="off">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 14px;">
                    <button type="button" class="comic-btn-secondary" onclick="document.getElementById('createAdminSection').style.display='none'; document.getElementById('adminListSection').style.display='flex';">Cancel</button>
                    <button type="submit" class="comic-btn">Save &amp; Create Administrator</button>
                </div>
            </form>
        </div>

    </section>

    <!-- Lightweight client filter for SSR table -->
    <script>
    function filterAdminTable() {
        var input = document.getElementById("adminSearchInput");
        var filter = input.value.toLowerCase();
        var rows = document.querySelectorAll("#adminTable tbody tr.admin-row");
        rows.forEach(function(row) {
            var text = row.innerText.toLowerCase();
            row.style.display = text.indexOf(filter) > -1 ? "" : "none";
        });
    }
    </script>
    </div>
</body>
</html>
