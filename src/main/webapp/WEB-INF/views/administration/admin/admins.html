<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Staff Admins &amp; Permissions | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
    <section class="comic-card page-slide-fade">
        
        <!-- SSR Flash Messages -->
        <div th:if="${successMessage}" class="comic-alert-success" style="margin-bottom: 16px; padding: 12px 16px; background-color: #ECFDF5; border: 2px solid #059669; border-radius: 8px; color: #065F46; font-weight: 700;" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="comic-alert-danger" style="margin-bottom: 16px; padding: 12px 16px; background-color: #FEF2F2; border: 2px solid #DC2626; border-radius: 8px; color: #991B1B; font-weight: 700;" th:text="${errorMessage}"></div>

        <!-- 1.1 ADMIN LIST DIRECTORY VIEW FRAGMENT -->
        <div th:replace="~{administration/admin/adminDirectory :: adminDirectory}"></div>

        <!-- 1.2 CREATE ADMIN FORM FRAGMENT -->
        <div th:replace="~{administration/admin/adminForm :: adminForm}"></div>

        <!-- 1.3 INSPECT ADMIN MODAL FRAGMENT -->
        <div th:replace="~{administration/admin/adminModals :: adminModals}"></div>

    </section>

    <!-- Client-Side Admin Management Script -->
    <script>
    function filterAdminTable() {
        var input = document.getElementById("adminSearchInput");
        var filter = input.value.toLowerCase();
        var rows = document.querySelectorAll("#adminTable tbody tr.admin-row");
        rows.forEach(function(row) {
            var text = row.innerText.toLowerCase();
            row.style.display = text.indexOf(filter) > -1 ? "" : "none";
        });
    }

    function showCreateAdminSection() {
        document.getElementById('adminListSection').style.display = 'none';
        document.getElementById('createAdminSection').style.display = 'flex';
    }

    function hideCreateAdminSection() {
        document.getElementById('createAdminSection').style.display = 'none';
        document.getElementById('adminListSection').style.display = 'flex';
    }

    function syncAdminCreateBadge(modIdx, act) {
        var sw = document.getElementById('c_sw_' + modIdx + '_' + act);
        var badge = document.getElementById('c_badge_' + modIdx + '_' + act);
        if (sw && badge) {
            if (sw.checked) badge.classList.add('active');
            else badge.classList.remove('active');
        }
    }

    function applyAdminCreateCardPreset(modIdx, type) {
        var swC = document.getElementById('c_sw_' + modIdx + '_create');
        var swR = document.getElementById('c_sw_' + modIdx + '_read');
        var swU = document.getElementById('c_sw_' + modIdx + '_update');
        var swD = document.getElementById('c_sw_' + modIdx + '_delete');

        if (type === 'full') {
            swC.checked = true; swR.checked = true; swU.checked = true; swD.checked = true;
        } else if (type === 'readonly') {
            swC.checked = false; swR.checked = true; swU.checked = false; swD.checked = false;
        } else if (type === 'revoke') {
            swC.checked = false; swR.checked = false; swU.checked = false; swD.checked = false;
        }

        ['create', 'read', 'update', 'delete'].forEach(function(a) {
            syncAdminCreateBadge(modIdx, a);
        });
    }

    function applyAdminCreateGlobalPreset(type) {
        [0, 1, 2].forEach(function(idx) {
            applyAdminCreateCardPreset(idx, type);
        });
    }

    function applyRoleToAdminCreate(pill) {
        var canC = pill.getAttribute('data-can-create') === 'true';
        var canR = pill.getAttribute('data-can-read') === 'true';
        var canU = pill.getAttribute('data-can-update') === 'true';
        var canD = pill.getAttribute('data-can-delete') === 'true';

        [0, 1, 2].forEach(function(idx) {
            document.getElementById('c_sw_' + idx + '_create').checked = canC;
            document.getElementById('c_sw_' + idx + '_read').checked = canR;
            document.getElementById('c_sw_' + idx + '_update').checked = canU;
            document.getElementById('c_sw_' + idx + '_delete').checked = canD;
            ['create', 'read', 'update', 'delete'].forEach(function(a) {
                syncAdminCreateBadge(idx, a);
            });
        });
    }

    function toggleCreateSuperAdmin(isSuper) {
        var badge = document.getElementById('superAdminStatusBadge');
        if (isSuper) {
            badge.style.display = 'inline-block';
            applyAdminCreateGlobalPreset('full');
        } else {
            badge.style.display = 'none';
        }
    }

    function openInspectAdminModal(btn) {
        var adminId = btn.getAttribute('data-admin-id');
        var username = btn.getAttribute('data-username');
        var phone = btn.getAttribute('data-phone');
        var isSuper = btn.getAttribute('data-super-admin') === 'true';

        document.getElementById('inspectModalTitle').textContent = 'Inspect Administrator Permissions: ' + username;
        document.getElementById('inspectModalSubtitle').textContent = 'Phone: ' + (phone || 'None') + ' • Status: Configured';
        document.getElementById('inspectSuperAdmin').checked = isSuper;
        document.getElementById('inspectAdminForm').action = '/admin/admins/' + adminId + '/update-permissions';

        [0, 1, 2].forEach(function(idx) {
            document.getElementById('insp_sw_' + idx + '_create').checked = isSuper;
            document.getElementById('insp_sw_' + idx + '_read').checked = true;
            document.getElementById('insp_sw_' + idx + '_update').checked = isSuper;
            document.getElementById('insp_sw_' + idx + '_delete').checked = isSuper;
            ['create', 'read', 'update', 'delete'].forEach(function(a) {
                syncInspectBadge(idx, a);
            });
        });

        document.getElementById('inspectAdminModal').style.display = 'flex';
    }

    function closeInspectAdminModal() {
        document.getElementById('inspectAdminModal').style.display = 'none';
    }

    function syncInspectBadge(modIdx, act) {
        var sw = document.getElementById('insp_sw_' + modIdx + '_' + act);
        var badge = document.getElementById('insp_b_' + modIdx + '_' + act);
        if (sw && badge) {
            if (sw.checked) badge.classList.add('active');
            else badge.classList.remove('active');
        }
    }

    function applyRoleToAdminInspect(pill) {
        var canC = pill.getAttribute('data-can-create') === 'true';
        var canR = pill.getAttribute('data-can-read') === 'true';
        var canU = pill.getAttribute('data-can-update') === 'true';
        var canD = pill.getAttribute('data-can-delete') === 'true';

        [0, 1, 2].forEach(function(idx) {
            document.getElementById('insp_sw_' + idx + '_create').checked = canC;
            document.getElementById('insp_sw_' + idx + '_read').checked = canR;
            document.getElementById('insp_sw_' + idx + '_update').checked = canU;
            document.getElementById('insp_sw_' + idx + '_delete').checked = canD;
            ['create', 'read', 'update', 'delete'].forEach(function(a) {
                syncInspectBadge(idx, a);
            });
        });
    }

    function toggleInspectSuperAdmin(isSuper) {
        if (isSuper) {
            [0, 1, 2].forEach(function(idx) {
                document.getElementById('insp_sw_' + idx + '_create').checked = true;
                document.getElementById('insp_sw_' + idx + '_read').checked = true;
                document.getElementById('insp_sw_' + idx + '_update').checked = true;
                document.getElementById('insp_sw_' + idx + '_delete').checked = true;
                ['create', 'read', 'update', 'delete'].forEach(function(a) {
                    syncInspectBadge(idx, a);
                });
            });
        }
    }
    </script>
    </div>
</body>
</html>
