<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Follow-ups | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="comic-card" ng-controller="FollowupController">
            <!-- 3.1 CUSTOMER DIRECTORY VIEW FRAGMENT -->
            <div th:replace="~{administration/customer/customerDirectory :: customerDirectory}"></div>

            <!-- 3.2 CUSTOMER PURCHASE ORDERS FRAGMENT -->
            <div th:replace="~{administration/customer/orderDirectory :: orderDirectory}"></div>

            <!-- 3.3 CUSTOMER FEEDBACK & NOTES FRAGMENT -->
            <div th:replace="~{administration/customer/feedbackDirectory :: feedbackDirectory}"></div>
        </section>
    </div>
</body>
</html>
