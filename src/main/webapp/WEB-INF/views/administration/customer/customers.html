<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Follow-ups | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="comic-card" ng-controller="FollowupController">
            <!-- 3.1 Customer Follow-up Directory -->
            <div th:replace="~{administration/customer/fragments/followup-directory :: followupDirectory}"></div>

            <!-- 3.2 Customer Purchase History / Order Log -->
            <div th:replace="~{administration/customer/fragments/followup-orders :: followupOrders}"></div>

            <!-- 3.3 Customer Feedback & Notes -->
            <div th:replace="~{administration/customer/fragments/followup-feedback :: followupFeedback}"></div>
        </section>
    </div>
</body>
</html>
