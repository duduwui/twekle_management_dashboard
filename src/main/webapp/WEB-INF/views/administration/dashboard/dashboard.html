<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Dashboard Overview | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="comic-card dashboard-card" ng-controller="DashboardController">
            <div class="dashboard-container">
                <!-- 1. KPIS AND VISUAL PROGRESS FRAGMENT -->
                <div th:replace="~{administration/dashboard/dashboardKpis :: dashboardKpis}"></div>

                <!-- 2. PRIORITY ATTENTION TABLE FRAGMENT -->
                <div th:replace="~{administration/dashboard/priorityTable :: priorityTable}"></div>
            </div>

            <!-- 3. DASHBOARD MODALS FRAGMENT -->
            <div th:replace="~{administration/dashboard/dashboardModals :: dashboardModals}"></div>
        </section>
    </div>
</body>
</html>
