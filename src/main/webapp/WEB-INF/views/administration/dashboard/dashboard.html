<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Dashboard Overview | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="comic-card dashboard-card">
            <div class="dashboard-container">
                <!-- 1. KPIS AND VISUAL PROGRESS -->
                <th:block th:replace="~{administration/dashboard/dashboardKpis :: dashboardKpis}"></th:block>

                <!-- 2. PRIORITY ATTENTION TABLE -->
                <th:block th:replace="~{administration/dashboard/priorityTable :: priorityTable}"></th:block>
            </div>

            <!-- 3. DASHBOARD DIALOG MODALS -->
            <th:block th:replace="~{administration/dashboard/dashboardModals :: dashboardModals}"></th:block>
        </section>
    </div>
</body>
</html>
