<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="dashboardDetailsModal" th:remove="tag">
    <dialog id="customerRegistrations" class="comic-modal dashboard-dialog" aria-labelledby="registrationsTitle">
        <div class="comic-modal-header"><h3 id="registrationsTitle">Customer Registrations</h3><button type="button" class="comic-modal-close" data-close-dialog aria-label="Close">&times;</button></div>
        <div class="comic-modal-body">
            <div class="visual-legend-row">
                <button type="button" class="comic-btn btn-sm" data-registration-days="7">Last 7 days</button>
                <button type="button" class="comic-btn btn-sm" data-registration-days="30">Last 30 days</button>
                <button type="button" class="comic-btn btn-sm" data-registration-days="0">All customers</button>
            </div>
            <table class="comic-table table-centered">
                <thead><tr><th>Customer</th><th>Phone</th><th>City</th><th>Registered</th><th>Orders</th><th>Total Spent</th></tr></thead>
                <tbody><tr th:each="summary : ${allCustomers}" th:with="customer=${summary.customer}" th:attr="data-registered=${customer.createdAt}">
                    <td th:text="${customer.name}"></td><td th:text="${customer.phoneNumber}"></td><td th:text="${customer.city}"></td>
                    <td th:text="${customer.createdAt}"></td><td th:text="${customer.totalOrders}"></td><td th:text="${customer.totalSpent}"></td>
                </tr></tbody>
            </table>
            <p id="registrationsEmpty" hidden>No registrations in this period.</p>
        </div>
        <div class="comic-modal-footer"><a class="comic-btn btn-primary" th:href="@{/admin/followups}">Open Customer Directory</a></div>
    </dialog>
    <dialog id="unsatisfiedFeedback" class="comic-modal dashboard-dialog" aria-labelledby="feedbackTitle">
        <div class="comic-modal-header"><h3 id="feedbackTitle">Unsatisfied Customer Feedback</h3><button type="button" class="comic-modal-close" data-close-dialog aria-label="Close">&times;</button></div>
        <div class="comic-modal-body">
            <table class="comic-table table-centered" th:unless="${#lists.isEmpty(satisfactionDetails)}">
                <thead><tr><th>Customer</th><th>Order</th><th>Rating</th><th>Reason</th><th>Date</th></tr></thead>
                <tbody><tr th:each="item : ${satisfactionDetails}">
                    <td th:text="${item.customerName}"></td><td th:text="${item.orderNumber}"></td><td th:text="${item.rating}"></td>
                    <td th:text="${item.comment}"></td><td th:text="${item.feedbackDate}"></td>
                </tr></tbody>
            </table>
            <p th:if="${#lists.isEmpty(satisfactionDetails)}">No unsatisfied feedback recorded.</p>
        </div>
        <div class="comic-modal-footer"><a class="comic-btn btn-primary" th:href="@{/admin/reports(tab=satisfaction)}">View Satisfaction Reports</a></div>
    </dialog>
</div>
</body></html>
