<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<dialog th:fragment="dashboardQuickActions" id="followupProgress" class="comic-modal dashboard-dialog" aria-labelledby="progressTitle">
    <div class="comic-modal-header"><h3 id="progressTitle">Follow-up Completion Breakdown</h3><button type="button" class="comic-modal-close" data-close-dialog aria-label="Close">&times;</button></div>
    <div class="comic-modal-body">
        <p>Completed: <strong th:text="${stats.completedFollowups}"></strong></p>
        <p>Overdue: <strong th:text="${stats.overdueFollowups}"></strong></p>
        <p>In queue: <strong th:text="${stats.inQueueFollowups}"></strong></p>
        <p>Completion rate: <strong th:text="|${stats.completionPercentage}%|"></strong></p>
    </div>
    <div class="comic-modal-footer">
        <a class="comic-btn btn-primary" th:href="@{/admin/followups(status=DONE)}">Completed</a>
        <a class="comic-btn btn-primary" th:href="@{/admin/followups(status=ALERT)}">Overdue</a>
        <a class="comic-btn btn-primary" th:href="@{/admin/followups(status=IDLE)}">In Queue</a>
    </div>
</dialog>
</body></html>
