<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="dashboardQuickActions" th:remove="tag">
    <!-- 6. FOLLOW-UP PROGRESS DETAIL MODAL -->
    <div class="comic-modal-overlay" style="display: none;" ng-style="{'display': showProgressModal ? 'flex' : 'none'}" ng-show="showProgressModal">
        <div class="comic-modal" style="max-width: 620px; width: 92%;">
            <div class="comic-modal-header">
                <div>
                    <h3 class="modal-title">Follow-up Completion Breakdown</h3>
                    <p class="modal-subtitle">Current status of customer check-in checkpoints</p>
                </div>
                <button type="button" class="comic-modal-close" ng-click="closeProgressModal()" title="Close">&times;</button>
            </div>

            <div class="comic-modal-body" style="padding: 24px; text-align: center;">
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px;">
                    <div class="comic-kpi-card" style="padding: 14px;">
                        <span class="kpi-label">COMPLETED</span>
                        <span class="kpi-value kpi-primary" style="color: #16A34A;">{{ stats.completedFollowups || 0 }}</span>
                        <span class="kpi-subtext">Checks passed</span>
                    </div>
                    <div class="comic-kpi-card" style="padding: 14px;">
                        <span class="kpi-label">IN QUEUE</span>
                        <span class="kpi-value" style="color: #D97706;">{{ stats.pendingFollowups || 0 }}</span>
                        <span class="kpi-subtext">Waiting follow-up</span>
                    </div>
                    <div class="comic-kpi-card" style="padding: 14px;">
                        <span class="kpi-label">RATE</span>
                        <span class="kpi-value kpi-primary">{{ stats.completionPercentage || 0 }}%</span>
                        <span class="kpi-subtext">Completion rate</span>
                    </div>
                </div>

                <!-- Progress Bar in Modal -->
                <div class="visual-bar-track" style="margin-bottom: 20px; height: 18px;">
                    <div class="visual-bar-completed" ng-style="{'width': (stats.completionPercentage || 0) + '%'}"></div>
                    <div class="visual-bar-pending" ng-style="{'width': (100 - (stats.completionPercentage || 0)) + '%'}"></div>
                </div>

                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <button type="button" class="comic-btn btn-primary" ng-click="filterDone()" style="background-color: #16A34A; border-color: #16A34A;">
                        Filter to Completed
                    </button>
                    <button type="button" class="comic-btn btn-primary" ng-click="filterPendingQueue()" style="background-color: #D97706; border-color: #D97706;">
                        Filter to Queue
                    </button>
                </div>
            </div>

            <div class="comic-modal-footer">
                <button type="button" class="comic-btn btn-ghost" ng-click="closeProgressModal()">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
