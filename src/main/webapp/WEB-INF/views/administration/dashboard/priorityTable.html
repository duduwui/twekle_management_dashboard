<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="priorityTable" class="priority-table-card">
    <div class="priority-header">
        <h3 class="priority-title">Priority Attention: Next Follow-ups (Most Overdue First)</h3>
        <a class="comic-btn btn-sm btn-ghost" th:href="@{/admin/followups}">View All Customers</a>
    </div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(urgentCustomers)}">
        <table class="comic-table table-centered">
            <thead><tr><th>Customer Name</th><th>Phone Number</th><th>City</th><th>Milestone</th><th>Minutes Until Due</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>
                <tr th:each="summary : ${urgentCustomers}">
                    <td><strong th:text="${summary.customer.name}"></strong></td>
                    <td th:text="${summary.customer.phoneNumber}"></td>
                    <td th:text="${summary.customer.city ?: '-'}"></td>
                    <td th:text="${summary.nextPendingFollowup}"></td>
                    <td th:text="${summary.nextPendingMinutesLeft ?: 'Unscheduled'}"></td>
                    <td><span class="comic-tag" th:classappend="${summary.followupStatus == 'ALERT' ? 'tag-danger' : 'tag-warning'}" th:text="${summary.followupStatus == 'ALERT' ? 'Overdue' : 'In Queue'}"></span></td>
                    <td><a class="comic-btn btn-sm btn-primary" th:href="@{/admin/followups/orders/{id}(id=${summary.customer.customerId})}">Open</a></td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="priority-empty-state" th:if="${#lists.isEmpty(urgentCustomers)}">There are no pending or overdue follow-ups right now.</p>
</div>
</body></html>
