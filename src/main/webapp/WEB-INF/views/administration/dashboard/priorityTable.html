<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="priorityTable" class="priority-table-card">
    <div class="priority-header" style="justify-content: space-between;">
        <h3 class="priority-title" style="margin: 0;">
            <span>Priority Attention: Next Follow-ups (Most Overdue First)</span>
        </h3>
        <a class="comic-btn btn-sm btn-ghost" th:href="@{/admin/followups}" title="View all customers in Follow-ups tab">
            View All Customers
        </a>
    </div>

    <!-- When There Are Customers Needing Follow-up -->
    <div class="table-responsive" th:unless="${#lists.isEmpty(urgentCustomers)}">
        <table class="comic-table table-centered">
            <thead>
                <tr>
                    <th>Customer Name</th>
                    <th>Phone Number</th>
                    <th>City</th>
                    <th>Milestone</th>
                    <th>Remaining Time</th>
                    <th>Status</th>
                    <th style="width: 120px;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="summary : ${urgentCustomers}">
                    <td>
                        <strong style="color: var(--text-main);" th:text="${summary.customer.name}">Customer Name</strong>
                    </td>
                    <td>
                        <span class="text-muted" th:text="${summary.customer.phoneNumber}">-</span>
                    </td>
                    <td>
                        <span class="comic-tag tag-gray" th:text="${summary.customer.city ?: '-'}">-</span>
                    </td>
                    <td>
                        <span class="font-bold" th:text="${summary.nextPendingFollowup ?: 'Pending Check'}">Milestone</span>
                    </td>
                    <td>
                        <span class="comic-tag live-countdown-tag"
                              th:classappend="${summary.overdue ? 'tag-danger' : 'tag-warning'}"
                              th:attr="data-minutes-left=${summary.nextPendingMinutesLeft}"
                              th:text="${summary.formattedRemainingTime}">
                            Scheduled
                        </span>
                    </td>
                    <td>
                        <span class="comic-tag"
                              th:classappend="${summary.overdue ? 'tag-danger' : 'tag-warning'}"
                              th:text="${summary.overdue ? 'Overdue' : 'In Queue'}">
                            In Queue
                        </span>
                    </td>
                    <td>
                        <a class="comic-btn btn-sm btn-primary"
                           th:href="@{/admin/followups/orders/{id}(id=${summary.customer.id})}"
                           title="Open customer follow-up orders">
                            Open
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Empty State (When All Caught Up) -->
    <div class="priority-empty-state" th:if="${#lists.isEmpty(urgentCustomers)}" style="text-align: center;">
        <h4 class="priority-empty-title">All Caught Up</h4>
        <p class="priority-empty-desc">
            There are no pending or overdue follow-ups right now.
        </p>
    </div>
</div>
</body>
</html>
