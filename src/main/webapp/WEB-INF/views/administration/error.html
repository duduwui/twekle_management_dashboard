<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Failed | Twekl Administration</title>
    <link rel="stylesheet" href="/css/style.css?v=5.0">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-main, #F1F5F9); padding: 20px;">
    <div class="comic-card" style="max-width: 480px; width: 100%; text-align: center; padding: 36px 28px;">
        <div style="font-size: 3rem; margin-bottom: 12px;">⚠️</div>
        <h1 style="font-size: 1.5rem; font-weight: 900; color: #0F172A; margin: 0 0 10px 0;" th:text="|Request Failed (${status})|">Request Failed</h1>
        <p style="font-size: 0.95rem; color: #64748B; margin: 0 0 24px 0; font-weight: 600;" th:text="${message}">An error occurred processing your request.</p>
        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button type="button" class="comic-btn-secondary" onclick="history.back()">Back</button>
            <a class="comic-btn" th:href="@{/admin/dashboard}">Return to Dashboard</a>
        </div>
    </div>
</body>
</html>
