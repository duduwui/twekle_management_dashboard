<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{administration/fragments/adminLayout}">
<head><title>Twekl Administration</title></head><body><section layout:fragment="content" class="comic-card portal-page">
<div th:if="${successMessage}" class="portal-message" role="status" th:text="${successMessage}"></div>
<a th:href="@{/admin/followups/customers/{id}/orders(id=${order.customer.id})}">Back to orders</a>
<h1 th:text="|Order ${order.orderNumber}|"></h1><p th:text="${order.itemsSummary}"></p>
<form th:if="${@portalAccess.allows('CUSTOMER_FOLLOWUP','CREATE')}" method="post" th:action="@{/admin/followups/orders/{id}/synchronize(id=${order.id})}"><button class="comic-btn">Add missing active milestones</button></form>
<p th:if="${#lists.isEmpty(checks)}">No checkpoints have been created. A user with create permission can add the active milestones.</p>
<article th:each="check : ${checks}" class="portal-check">
<h2 th:text="${check.milestoneName}"></h2><p th:text="${check.completed == true ? 'Completed' : (check.minutesUntilDue != null &amp;&amp; check.minutesUntilDue &lt; 0 ? 'Overdue' : 'Pending')}"></p>
<p th:if="${check.minutesUntilDue != null}" th:text="|Minutes until due: ${check.minutesUntilDue}|"></p>
<form method="post" th:action="@{/admin/followups/checks/{id}(id=${check.id})}" class="portal-form">
<fieldset th:disabled="${!@portalAccess.allows('CUSTOMER_FOLLOWUP','UPDATE')}">
<label>Notes <textarea name="notes" maxlength="10000" rows="4" th:text="${check.notes}"></textarea></label>
<label>Satisfaction <select name="satisfaction"><option value="">Not rated</option><option th:each="s : ${ {'SATISFIED','NEUTRAL','UNSATISFIED'} }" th:value="${s}" th:selected="${s == check.satisfaction}" th:text="${s}"></option></select></label>
<label>New photo URL <input name="imageUrl" type="url" maxlength="2048" placeholder="https://"></label>
<label><input name="completed" type="checkbox" value="true" th:checked="${check.completed}"> Completed</label>
<button class="comic-btn btn-primary">Save checkpoint</button></fieldset></form>
<form th:if="${@portalAccess.allows('CUSTOMER_FOLLOWUP','UPDATE')}" method="post" enctype="multipart/form-data" th:action="@{/admin/followups/checks/{id}/photo(id=${check.id})}" class="portal-form">
<label>Upload photo (PNG or JPEG, up to 1 MB) <input type="file" name="photo" accept="image/png,image/jpeg" required></label><button class="comic-btn">Upload photo</button></form>
<details th:if="${check.hasImage}"><summary>Attached photo</summary><img loading="lazy" referrerpolicy="no-referrer" class="portal-photo" th:src="@{/admin/followups/checks/{id}/photo(id=${check.id})}" alt="Checkpoint attachment">
<form th:if="${@portalAccess.allows('CUSTOMER_FOLLOWUP','UPDATE')}" method="post" th:action="@{/admin/followups/checks/{id}/remove-image(id=${check.id})}"><button class="comic-btn btn-sm">Remove photo</button></form></details>
<p th:if="${check.checkedBy != null}" th:text="|Last checked by ${check.checkedBy} at ${check.checkedAt ?: 'an unknown time'}|"></p></article>
<nav th:replace="~{administration/fragments/pageNavigation :: pager(${'/admin/followups/orders/' + order.id}, '')}"></nav>
</section></body></html>
