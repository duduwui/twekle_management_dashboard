<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{administration/fragments/adminLayout}">
<head><title>Twekl Administration</title></head><body><section layout:fragment="content" class="comic-card portal-page">
<div th:if="${successMessage}" class="portal-message" role="status" th:text="${successMessage}"></div>
<h1 th:text="${customerId == null ? 'Add customer' : 'Edit customer'}"></h1>
<form method="post" th:action="${customerId == null} ? @{/admin/customers} : @{/admin/customers/{id}(id=${customerId})}" th:object="${customerForm}" class="portal-form">
<p th:if="${#fields.hasAnyErrors()}" th:each="err : ${#fields.allErrors()}" th:text="${err}" role="alert"></p>
<label>Name <input th:field="*{name}" required maxlength="255"></label><label>Phone <input th:field="*{phoneNumber}" required maxlength="20"></label>
<label>Email <input th:field="*{email}" type="email" maxlength="255"></label><label>City <input th:field="*{city}" maxlength="255"></label>
<button class="comic-btn btn-primary">Save customer</button><a th:href="@{/admin/followups}">Cancel</a></form>
</section></body></html>
