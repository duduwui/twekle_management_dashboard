<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{administration/fragments/adminLayout}">
<head><title>Twekl Administration</title></head><body><section layout:fragment="content" class="comic-card portal-page">
<div th:if="${successMessage}" class="portal-message" role="status" th:text="${successMessage}"></div>
<a th:href="@{/admin/followups}">Back to customers</a><h1 th:text="|Feedback for ${customer.name}|"></h1>
<table class="comic-table"><thead><tr><th>Rating</th><th>Comment</th><th>Date (UTC)</th></tr></thead><tbody><tr th:each="f : ${rows}"><td th:text="${f.rating}"></td><td th:text="${f.comment}"></td><td th:text="${f.date}"></td></tr><tr th:if="${rows.empty}"><td colspan="3">No feedback yet.</td></tr></tbody></table>
<nav th:replace="~{administration/fragments/pageNavigation :: pager(${ '/admin/followups/customers/' + customer.id + '/feedback'}, '')}"></nav>
</section></body></html>
