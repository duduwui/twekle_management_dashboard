<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="directory" class="table-responsive">
<table class="comic-table"><thead><tr><th>Customer</th><th>Phone</th><th>City</th><th>Orders</th><th>Spent</th><th>Pending</th><th>Status</th><th>Actions</th></tr></thead><tbody>
<tr th:each="c : ${rows}"><td th:text="${c.name}"></td><td th:text="${c.phone}"></td><td th:text="${c.city}"></td><td th:text="${c.orderCount}"></td><td th:text="${c.spent}"></td><td th:text="${c.pendingCount}"></td><td th:text="${c.status}"></td><td class="portal-actions">
<a th:href="@{/admin/followups/customers/{id}/orders(id=${c.id})}">Orders</a>
<a th:href="@{/admin/followups/customers/{id}/feedback(id=${c.id})}">Feedback</a>
<a th:if="${@portalAccess.allows('CUSTOMER_FOLLOWUP','UPDATE')}" th:href="@{/admin/customers/{id}/edit(id=${c.id})}">Edit</a>
<form th:if="${@portalAccess.allows('CUSTOMER_FOLLOWUP','DELETE')}" method="post" th:action="@{/admin/customers/{id}/delete(id=${c.id})}" onsubmit="return confirm('Delete this customer and their order history?')"><button class="comic-btn btn-sm">Delete</button></form>
</td></tr><tr th:if="${rows.empty}"><td colspan="8">No matching customers.</td></tr></tbody></table></div></body></html>
