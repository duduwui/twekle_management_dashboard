<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{administration/fragments/adminLayout}">
<head><title>Twekl Administration</title></head><body><section layout:fragment="content" class="comic-card portal-page">
<div th:if="${successMessage}" class="portal-message" role="status" th:text="${successMessage}"></div>
<a th:href="@{/admin/followups}">Back to customers</a><h1 th:text="|Orders for ${customer.name}|"></h1>
<table class="comic-table"><thead><tr><th>Order</th><th>Items</th><th>Date (UTC)</th><th>Amount</th><th>Status</th><th>Follow-ups</th></tr></thead><tbody>
<tr th:each="o : ${rows}"><td th:text="${o.number}"></td><td th:text="${o.items}"></td><td th:text="${o.ordered}"></td><td th:text="${o.amount}"></td><td th:text="${o.status}"></td><td><a th:href="@{/admin/followups/orders/{id}(id=${o.id})}">Open checklist</a></td></tr>
<tr th:if="${rows.empty}"><td colspan="6">No orders yet.</td></tr></tbody></table>
<nav th:replace="~{administration/fragments/pageNavigation :: pager(${ '/admin/followups/customers/' + customer.id + '/orders'}, '')}"></nav>
</section></body></html>
