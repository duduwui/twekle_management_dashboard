<body>

<!-- 1. HEAD FRAGMENT -->
<head th:fragment="head" th:replace="~{administration/fragments/headFragment :: headFragment}"></head>

<!-- 2. TOP HEADER FRAGMENT -->

<!-- 3. SIDEBAR NAVIGATION FRAGMENT -->

<!-- 4. MODALS & TOASTS FRAGMENT -->
<div th:fragment="modals" th:replace="~{administration/fragments/sharedModalsFragment :: sharedModalsFragment}"></div>

<!-- 5. SCRIPTS FRAGMENT -->
<div th:fragment="scripts" th:replace="~{administration/fragments/scriptsFragment :: scriptsFragment}"></div>

</body>
</html>
