<!DOCTYPE html>
<html lang="en" th:attr="ng-app=${activeTab == 'followups' || activeTab == 'reports' ? 'tweklApp' : null}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head th:replace="~{administration/fragments/headFragment :: headFragment}"></head>
<body th:attr="ng-controller=${activeTab == 'followups' || activeTab == 'reports' ? 'LayoutController' : null}">

    <div class="app-container">
        <!-- Sidebar Navigation Fragment -->
        <aside th:replace="~{administration/fragments/sidebarFragment :: sidebarFragment}"></aside>

        <!-- Main Content Wrapper -->
        <div class="main-wrapper">
            <!-- Top Header Fragment -->
            <header th:replace="~{administration/fragments/headerFragment :: headerFragment}"></header>

            <!-- Page Body: Content injected by individual view -->
            <main class="page-body">
                <div layout:fragment="content">
                    <!-- Default fallback content -->
                </div>
            </main>
        </div>
    </div>

    <form id="logoutForm" method="post" th:action="@{/logout}" hidden></form>

    <!-- Common Modals & Toasts Fragment -->
    <th:block th:if="${activeTab == 'followups' || activeTab == 'reports'}">
        <div th:replace="~{administration/fragments/sharedModalsFragment :: sharedModalsFragment}"></div>
    </th:block>

    <!-- Thymeleaf Server-Side Data Injection -->
    <script th:if="${activeTab == 'followups' || activeTab == 'reports'}" th:inline="javascript">
        /*<![CDATA[*/
        window.SERVER_ACTIVE_TAB = /*[[${activeTab}]]*/ 'dashboard';
        window.SERVER_FOLLOWUPS = /*[[${followupSummaries}]]*/ null;
        window.SERVER_REPORT_DATA = /*[[${reportData}]]*/ null;
        window.SERVER_REPORT_SUBTAB = /*[[${reportSubTab}]]*/ 'milestones';
        window.SERVER_PRESETS = /*[[${presets}]]*/ null;
        window.SERVER_ADMIN_LIST = /*[[${admins}]]*/ null;
        window.SERVER_ROLE_LIST = /*[[${roles}]]*/ null;
        window.SERVER_CURRENT_USER = /*[[${currentUser}]]*/ null;
        /*]]>*/
    </script>

    <!-- Scripts Fragment -->
    <div th:replace="~{administration/fragments/scriptsFragment :: scriptsFragment}"></div>

</body>
</html>
