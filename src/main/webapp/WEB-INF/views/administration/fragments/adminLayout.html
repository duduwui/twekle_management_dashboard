<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head th:replace="~{administration/fragments/headFragment :: headFragment}"></head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation Fragment -->
        <aside th:replace="~{administration/fragments/sidebarFragment :: sidebarFragment}"></aside>

        <!-- Main Content Wrapper -->
        <div class="main-wrapper">
            <!-- Top Header Fragment -->
            <header th:replace="~{administration/fragments/headerFragment :: headerFragment}"></header>

            <!-- Page Body: Content injected by individual view -->
            <main class="page-body">
                <div layout:fragment="content">
                    <!-- Default fallback content -->
                </div>
            </main>
        </div>
    </div>

    <form id="logoutForm" method="post" th:action="@{/logout}" hidden></form>

    <!-- Scripts Fragment -->
    <div th:replace="~{administration/fragments/scriptsFragment :: scriptsFragment}"></div>

</body>
</html>
