<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="headFragment">
    <meta charset="UTF-8">
    <th:block th:if="${_csrf != null}">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
    </th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twekl Admin Dashboard</title>

    <link th:if="${activeTab == 'dashboard'}" rel="stylesheet" th:href="@{/css/dashboard.css(v=14)}">
    <!-- Google Fonts (Non-blocking fallback to local system font stack) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <!-- Custom Comic Design System Style -->
    <link rel="stylesheet" href="/css/style.css?v=4.3">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
</html>
