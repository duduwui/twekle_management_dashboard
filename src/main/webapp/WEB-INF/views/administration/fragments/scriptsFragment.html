<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="scriptsFragment" th:remove="tag">
    <th:block th:if="${activeTab == 'followups' || activeTab == 'reports'}">
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
        <script src="/js/core/app.js?v=14"></script>
        <script src="/js/core/dateFilterHelper.js?v=14"></script>
        <script src="/js/core/layoutController.js?v=14"></script>
        <script src="/js/core/toast.js?v=14"></script>
        <script src="/js/timefilter/timefilter.js?v=14"></script>
    </th:block>

    <!-- Load only the current screen. -->
    <script th:if="${activeTab == 'dashboard'}" src="/js/dashboard/dashboard.js?v=14"></script>
    <script th:if="${activeTab == 'admins'}" src="/js/admin/admin.js?v=14"></script>
    <script th:if="${activeTab == 'roles'}" src="/js/role/role.js?v=14"></script>
    <script th:if="${activeTab == 'followups'}" src="/js/followup/followup.js?v=15"></script>
    <script th:if="${activeTab == 'timelines'}" src="/js/timefilter/timefilter.js?v=14"></script>
    <script th:if="${activeTab == 'reports'}" src="/js/report/report.js?v=14"></script>

    <!-- Clean Sidebar Category Accordion Toggle -->
    <script src="/js/core/navigation.js?v=14"></script>

</div>
</body>
</html>
