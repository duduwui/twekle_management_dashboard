<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebarFragment">
    <div class="brand-section">
        <img src="/images/twekl-logo.png" alt="Twekl Logo" class="brand-logo-img">
        <div class="brand-info">
            <span class="brand-title">Twekl</span>
            <span class="brand-subtitle">Management</span>
        </div>
    </div>

    <div class="nav-section">
        <span class="nav-label">Navigation</span>
        
        <!-- Group 0: Dashboard (Global Access) -->
        <a th:href="@{/admin/dashboard}" 
           class="nav-item" 
           th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
            <div style="display: flex; align-items: center; gap: 10px;">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>Dashboard</span>
            </div>
        </a>

        <div class="nav-divider"></div>

        <!-- Group 1: Administration Category Accordion -->
        <div class="nav-category-group" th:if="${currentUser == null || currentUser.superAdmin || currentUser.canManageUsers || currentUser.canCreateRoles}">
            <button type="button" 
                    class="nav-category-toggle" 
                    th:classappend="${activeTab == 'admins' || activeTab == 'roles'} ? 'active-category' : ''"
                    onclick="toggleCategoryNav('admin')">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="arrow-admin" 
                          class="category-arrow" 
                          th:classappend="${activeTab == 'admins' || activeTab == 'roles'} ? 'expanded' : ''">▶</span>
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Administration</span>
                </div>
            </button>

            <!-- Administration 2 Sub-tabs -->
            <div id="subnav-admin" 
                 class="nav-sub-items" 
                 th:style="${activeTab == 'admins' || activeTab == 'roles'} ? 'display: flex;' : 'display: none;'">
                <a th:href="@{/admin/admins}" 
                   class="nav-sub-item" 
                   th:if="${currentUser == null || currentUser.superAdmin || currentUser.canManageUsers}"
                   th:classappend="${activeTab == 'admins'} ? 'active' : ''">
                    <span>Admin Management</span>
                </a>
                <a th:href="@{/admin/roles}" 
                   class="nav-sub-item" 
                   th:if="${currentUser == null || currentUser.superAdmin || currentUser.canCreateRoles}"
                   th:classappend="${activeTab == 'roles'} ? 'active' : ''">
                    <span>Role Templates</span>
                </a>
            </div>
        </div>

        <div class="nav-divider" th:if="${currentUser == null || currentUser.superAdmin || currentUser.canManageUsers || currentUser.canCreateRoles}"></div>

        <!-- Group 2: Follow-ups -->
        <a th:href="@{/admin/followups}" 
           class="nav-item" 
           th:if="${currentUser == null || currentUser.superAdmin || currentUser.canReadFollowups}"
           th:classappend="${activeTab == 'followups' || activeTab == 'customers'} ? 'active' : ''">
            <div style="display: flex; align-items: center; gap: 10px;">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>Follow-ups</span>
            </div>
        </a>

        <div class="nav-divider" th:if="${currentUser == null || currentUser.superAdmin || currentUser.canReadReports}"></div>

        <div class="nav-category-group" th:if="${currentUser == null || currentUser.superAdmin || currentUser.canReadReports}">
            <button type="button" 
                    class="nav-category-toggle" 
                    th:classappend="${activeTab == 'reports'} ? 'active-category' : ''"
                    onclick="toggleCategoryNav('reports')">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="arrow-reports" 
                          class="category-arrow" 
                          th:classappend="${activeTab == 'reports'} ? 'expanded' : ''">▶</span>
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    <span>Reports</span>
                </div>
            </button>

            <!-- Reports 4 Sub-tabs -->
            <div id="subnav-reports" 
                 class="nav-sub-items" 
                 th:style="${activeTab == 'reports'} ? 'display: flex;' : 'display: none;'">
                <a th:href="@{/admin/reports(tab='milestones')}" 
                   class="nav-sub-item" 
                   th:classappend="${activeTab == 'reports' and (reportSubTab == 'milestones' or reportSubTab == null)} ? 'active' : ''">
                    <span>Follow-ups &amp; Milestones</span>
                </a>
                <a th:href="@{/admin/reports(tab='satisfaction')}" 
                   class="nav-sub-item" 
                   th:classappend="${activeTab == 'reports' and reportSubTab == 'satisfaction'} ? 'active' : ''">
                    <span>Satisfaction &amp; Notes</span>
                </a>
                <a th:href="@{/admin/reports(tab='products')}" 
                   class="nav-sub-item" 
                   th:classappend="${activeTab == 'reports' and reportSubTab == 'products'} ? 'active' : ''">
                    <span>Product Insights</span>
                </a>
                <a th:href="@{/admin/reports(tab='followups')}" 
                   class="nav-sub-item" 
                   th:classappend="${activeTab == 'reports' and (reportSubTab == 'customers' or reportSubTab == 'followups')} ? 'active' : ''">
                    <span>Follow-ups Summary</span>
                </a>
            </div>
        </div>

        <div class="nav-divider"></div>

        <!-- Group 4: Time Filters & Automation Presets -->
        <a th:href="@{/admin/timelines}" 
           class="nav-item" 
           th:classappend="${activeTab == 'timelines' || activeTab == 'time-filters'} ? 'active' : ''">
            <div style="display: flex; align-items: center; gap: 10px;">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>Time Filters</span>
            </div>
        </a>

        <!-- Bottom Session User Profile & Logout -->
        <div style="margin-top: auto; padding-top: 20px; border-top: 2px dashed #CBD5E1; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #F8FAFC; border: 2px solid var(--border-black); border-radius: 8px;">
                <div style="width: 32px; height: 32px; border-radius: 50%; background: #4F46E5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem;"
                     th:text="${currentUser != null ? #strings.substring(currentUser.username, 0, 1).toUpperCase() : 'A'}">A</div>
                <div style="display: flex; flex-direction: column; overflow: hidden;">
                    <strong style="font-size: 0.82rem; color: #1E293B; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;"
                            th:text="${currentUser != null ? currentUser.username : 'Administrator'}">Administrator</strong>
                    <span style="font-size: 0.72rem; color: #64748B; font-weight: 600;"
                          th:text="${currentUser != null && currentUser.superAdmin ? 'Super Admin' : 'Staff Admin'}">Staff Admin</span>
                </div>
            </div>

            <form th:action="@{/admin/logout}" method="post">
                <button type="submit" class="comic-btn-secondary" style="width: 100%; padding: 8px 12px; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Sign Out</span>
                </button>
            </form>
        </div>
    </div>
</aside>
</body>
</html>
