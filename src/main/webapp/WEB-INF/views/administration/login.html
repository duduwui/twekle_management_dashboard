<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Twekl Management Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/css/login.css?v=11.0">
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <h1 class="brand-name">Twekl</h1>
            <span class="brand-badge">Management Dashboard</span>
        </div>

        <form class="form" method="post" th:action="@{/login}">
            <div class="form_control">
                <label class="label" for="username">Type username</label>
                <input type="text" class="input" id="username" name="username" required="" autocomplete="username" placeholder="Enter username">
            </div>

            <div class="form_control">
                <label class="label" for="password">Password</label>
                <input type="password" class="input" id="password" name="password" required="" autocomplete="current-password" placeholder="••••••••">
            </div>

            <div th:if="${param.error}" class="login-error" style="display: block;">
                <span th:if="${#strings.equals(param.error, 'access_denied')}">Session expired or access denied. Please log in again.</span>
                <span th:unless="${#strings.equals(param.error, 'access_denied')}">Invalid username or password.</span>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                <span class="spinner" id="loginSpinner"></span>
                <span id="loginBtnText">Login</span>
            </button>
        </form>
    </div>


</body>
</html>
