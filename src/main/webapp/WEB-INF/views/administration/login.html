<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Twekl Management Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #0F172A;
            padding: 20px;
        }

        /* Login Container Card */
        .container {
            width: 380px;
            max-width: 100%;
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            padding: 2.6rem 2.2rem;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.06), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
        }

        /* Brand Header (No icons) */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
            text-align: center;
        }

        .brand-name {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #0F172A;
            line-height: 1.2;
        }

        .brand-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: #1F8772;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Form */
        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .form_control {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .form_control .label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #1E293B;
            letter-spacing: 0.2px;
            user-select: none;
        }

        .form_control .input {
            width: 100%;
            background-color: #FFFFFF;
            border: 1.5px solid #CBD5E1;
            outline: none;
            color: #0F172A !important;
            padding: 0.82rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            border-radius: 8px;
            transition: all 0.2s ease;
            caret-color: #1F8772;
        }

        .form_control .input::placeholder {
            color: #94A3B8;
            font-size: 0.88rem;
        }

        .form_control .input:focus {
            border-color: #35B89F;
            box-shadow: 0 0 0 3px rgba(53, 184, 159, 0.22);
        }

        /* Autofill White Background & Crisp Dark Text Override */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 40px #FFFFFF inset !important;
            -webkit-text-fill-color: #0F172A !important;
            caret-color: #1F8772 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Pure Green Login Button */
        .login-btn {
            width: 100%;
            margin-top: 8px;
            background-color: #35B89F;
            border: none;
            outline: none;
            color: #FFFFFF;
            padding: 0.85rem;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(53, 184, 159, 0.35);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            background-color: #1F8772;
            box-shadow: 0 6px 18px rgba(31, 135, 114, 0.4);
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(31, 135, 114, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            display: none;
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
            color: #B91C1C;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            text-align: center;
            width: 100%;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <h1 class="brand-name">Twekl</h1>
            <span class="brand-badge">Management Dashboard</span>
        </div>

        <form class="form" onsubmit="handleLogin(event)">
            <div class="form_control">
                <label class="label" for="username">Type username</label>
                <input type="text" class="input" id="username" required="" autocomplete="username" placeholder="Enter username">
            </div>

            <div class="form_control">
                <label class="label" for="password">Password</label>
                <input type="password" class="input" id="password" required="" autocomplete="current-password" placeholder="••••••••">
            </div>

            <div id="loginError" class="login-error"></div>

            <button type="submit" id="loginBtn" class="login-btn">
                <span class="spinner" id="loginSpinner"></span>
                <span id="loginBtnText">Login</span>
            </button>
            <div style="margin-top: 14px; text-align: center; font-size: 0.78rem; color: #64748B;">
                Default credentials: <strong style="color: #0F172A;">twekl_super_admin</strong> / <strong style="color: #0F172A;">Super@2026</strong>
            </div>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginSpinner');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            errEl.style.display = 'none';
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.innerText = 'Signing In...';

            try {
                let res = await fetch('/admin/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok && (res.status === 404 || res.status === 500)) {
                    res = await fetch('/admin/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                }

                const data = await res.json();

                if (res.ok && data.success && data.data && data.data.authenticated) {
                    var targetUrl = '/admin/dashboard';
                    var user = data.data;
                    if (!user.isSuperAdmin && !user.superAdmin) {
                        if (!user.canReadFollowups) {
                            if (user.canReadReports) targetUrl = '/admin/reports';
                            else if (user.canManageUsers) targetUrl = '/admin/admins';
                            else if (user.canCreateRoles) targetUrl = '/admin/roles';
                        }
                    }
                    window.location.href = targetUrl;
                } else {
                    errEl.innerText = data.message || 'Invalid username or password';
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.innerText = 'Login';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (err) {
                errEl.innerText = 'Connection error. Please try again.';
                errEl.style.display = 'block';
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = 'Login';
            }
        }
    </script>
</body>
</html>
