<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Reports &amp; Analytics | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="comic-card page-slide-fade" ng-controller="ReportController">
            <!-- REPORT TAB 1: FOLLOW-UPS & MILESTONES -->
            <th:block th:replace="~{administration/report/milestonesTab :: milestonesTab}"></th:block>

            <!-- REPORT TAB 2: CUSTOMER SATISFACTION & REVIEWS -->
            <th:block th:replace="~{administration/report/satisfactionTab :: satisfactionTab}"></th:block>

            <!-- REPORT TAB 3: PRODUCT INSIGHTS & REVIEWS -->
            <th:block th:replace="~{administration/report/productsTab :: productsTab}"></th:block>

            <!-- REPORT TAB 4: FOLLOW-UP SUMMARY -->
            <th:block th:replace="~{administration/report/followupsTab :: followupsTab}"></th:block>
        </section>
    </div>
</body>
</html>
