<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Reports &amp; Analytics | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="comic-card page-slide-fade" ng-controller="ReportController">
            <!-- REPORT TAB 1: FOLLOW-UPS & MILESTONES -->
            <div th:replace="~{administration/report/reportMilestones :: reportMilestones}"></div>

            <!-- REPORT TAB 2: CUSTOMER SATISFACTION & NOTES -->
            <div th:replace="~{administration/report/reportSatisfaction :: reportSatisfaction}"></div>

            <!-- REPORT TAB 3: PRODUCT INSIGHTS & REVIEWS -->
            <div th:replace="~{administration/report/reportProducts :: reportProducts}"></div>

            <!-- REPORT TAB 4: CUSTOMER DIRECTORY SUMMARY -->
            <div th:replace="~{administration/report/reportCustomers :: reportCustomers}"></div>
        </section>
    </div>
</body>
</html>
