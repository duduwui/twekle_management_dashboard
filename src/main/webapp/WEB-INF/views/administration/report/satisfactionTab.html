<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
            <!-- REPORT TAB 2: CUSTOMER SATISFACTION & NOTES -->
            <div th:fragment="satisfactionTab" ng-show="reportSubTab === 'satisfaction'" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="comic-filter-toolbar">
                    <div class="filter-left-controls" style="flex-wrap: wrap; gap: 8px; align-items: center;">
                        <span class="filter-date-label">From:</span>
                        <input type="date" lang="en-GB" class="comic-date-input" ng-model="reportFilters.dateFrom" ng-change="applyReportDateFilter()" title="Start Date">
                        <span class="filter-date-label">To:</span>
                        <input type="date" lang="en-GB" class="comic-date-input" ng-model="reportFilters.dateTo" ng-change="applyReportDateFilter()" title="End Date">

                        <button type="button" class="comic-btn" style="padding: 6px 14px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px;" ng-click="openReportFilterModal()" title="Open Filters Popup">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                            <span>Filters</span>
                        </button>

                        <!-- Active Filter Badges -->
                        <span class="comic-tag tag-primary active-preset-pill" ng-if="selectedReportPreset" ng-click="selectReportPreset(null)" title="Click to clear preset">
                            <span ng-bind="selectedReportPreset.name"></span> ✕
                        </span>
                        <span class="comic-tag tag-primary active-preset-pill" ng-if="reportFilters.satisfactionFilter && reportFilters.satisfactionFilter !== 'all'" ng-click="clearSatisfactionFilter()" title="Click to clear scale">
                            <span ng-bind="'Scale: ' + reportFilters.satisfactionFilter"></span> ✕
                        </span>
                        <span class="comic-tag tag-primary active-preset-pill" ng-if="reportFilters.milestoneFilter && reportFilters.milestoneFilter !== 'all'" ng-click="reportFilters.milestoneFilter = 'all'" title="Click to clear milestone">
                            <span ng-bind="'Milestone: ' + reportFilters.milestoneFilter"></span> ✕
                        </span>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <div class="filter-search-box" style="min-width: 210px;">
                            <input type="search" class="comic-search-bar" placeholder="Search customer, order, note text..." ng-model="reportFilters.searchNotes">
                        </div>
                        <button type="button" class="comic-btn" style="padding: 5px 12px; font-size: 0.8rem; white-space: nowrap;" ng-click="exportReportCsv()">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>Export CSV
                        </button>
                    </div>
                </div>

                <!-- Detailed Notes & Satisfaction Table -->
                <div class="table-responsive">
                    <table class="comic-table">
                        <thead>
                            <tr>
                                <th>Customer Details</th>
                                <th class="nowrap col-phone">Phone</th>
                                <th class="nowrap">Milestone</th>
                                <th class="nowrap">Satisfaction</th>
                                <th>Note &amp; Feedback Details</th>
                                <th class="nowrap">Proof Photo</th>
                                <th class="nowrap">Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="n in getFilteredReportNotes() track by n.id">
                                <td><strong style="color: #0F172A;" ng-bind="n.customerName"></strong></td>
                                <td class="nowrap col-phone"><span ng-bind="n.customerPhone"></span></td>
                                <td class="nowrap"><span style="font-weight: 700; color: #475569;" ng-bind="n.presetName"></span></td>
                                <td class="nowrap">
                                    <span class="sat-badge sat-badge-satisfied" ng-if="n.satisfaction === 'SATISFIED'">Satisfied</span>
                                    <span class="sat-badge sat-badge-neutral" ng-if="n.satisfaction === 'NEUTRAL' || !n.satisfaction">Neutral</span>
                                    <span class="sat-badge sat-badge-unsatisfied" ng-if="n.satisfaction === 'UNSATISFIED'">Unsatisfied</span>
                                </td>
                                <td>
                                    <div class="report-note-cell" ng-bind="n.note || '-'"></div>
                                </td>
                                <td class="nowrap">
                                    <img ng-if="n.hasImage" ng-src="{{n.imageUrl}}" style="width: 38px; height: 38px; object-fit: cover; border-radius: 4px; border: 1.5px solid #000; cursor: pointer;" ng-click="previewImage(n.imageUrl)" title="Click to view full photo" alt="Photo">
                                    <span ng-if="!n.hasImage" style="color: #94A3B8; font-size: 0.8rem;">-</span>
                                </td>
                                <td class="nowrap"><span style="font-size: 0.8rem; color: #64748B;" ng-bind="n.date ? (n.date | date:'yyyy-MM-dd') : '-'"></span></td>
                            </tr>
                            <tr ng-if="getFilteredReportNotes().length === 0">
                                <td colspan="7" style="text-align: center; padding: 24px; color: #64748B; font-weight: 700;">
                                    No customer notes match the selected criteria.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

</body>
</html>
