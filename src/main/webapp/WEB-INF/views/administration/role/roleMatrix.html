<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="roleMatrix" id="roleAssignmentSection" style="display: none; margin-top: 24px;">
    <form id="roleAssignForm" th:action="@{/admin/roles/assign_user_role}" method="post" autocomplete="off">
        <input type="hidden" id="formAdminId" name="adminId" value="">
        <input type="hidden" id="formRoleId" name="roleIds" value="">

        <!-- Clean Permissions Header for Clicked Administrator -->
        <div th:replace="~{administration/role/roleMatrixHeader :: roleMatrixHeader}"></div>

        <!-- 3-COLUMN MODULE PERMISSION CARDS MATRIX -->
        <div th:replace="~{administration/role/roleMatrixCards :: roleMatrixCards}"></div>

        <!-- Bottom Save Action Bar -->
        <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
            <button type="submit" class="comic-btn" style="padding: 10px 24px; font-size: 0.95rem;">
                Save Admin Role &amp; Permissions
            </button>
        </div>

    </form>
</div>
</body>
</html>
