<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="roleMatrixHeader" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; padding: 14px 20px; background: #EEF2FF; border: 2px solid var(--border-black); border-radius: 8px;">
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <span class="comic-tag tag-primary" style="font-weight: 800; font-size: 0.82rem;">PERMISSIONS FOR:</span>
        <strong id="selectedAdminDisplay" style="font-size: 1.15rem; color: #1E1B4B;">-</strong>
        <span id="selectedAdminAccessBadge" class="comic-tag tag-muted" style="font-size: 0.8rem; font-weight: 700;"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <button type="button" class="comic-btn-secondary" onclick="closeRoleAssignmentSection()" style="padding: 7px 16px;">
            Close
        </button>
        <button type="submit" id="saveRoleBtnTop" class="comic-btn" style="padding: 7px 20px;">
            Save Permissions
        </button>
    </div>
</div>
</body>
</html>
