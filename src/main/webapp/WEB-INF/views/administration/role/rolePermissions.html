<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="rolePermissions" th:if="${selectedAdmin != null}" class="portal-page">
<h2 th:text="|Permissions for ${selectedAdmin.username}|"></h2><p th:if="${selectedAdmin.superAdmin}">Super administrators retain unrestricted access.</p>
<form method="post" th:action="@{/admin/roles/assign_user_role}" th:unless="${selectedAdmin.superAdmin}">
<input type="hidden" name="adminId" th:value="${selectedAdmin.id}"><fieldset th:disabled="${!@portalAccess.allows('ROLE_MANAGEMENT','UPDATE')}">
<div class="module-cards-grid"><article class="comic-module-card" th:each="p,i : ${permissionForm}">
<h3 th:text="${p.moduleNameEn}"></h3><input type="hidden" th:name="|permissions[${i.index}].moduleKey|" th:value="${p.moduleKey}"><input type="hidden" th:name="|permissions[${i.index}].moduleNameEn|" th:value="${p.moduleNameEn}">
<label><input type="checkbox" th:name="|permissions[${i.index}].canCreate|" value="true" th:checked="${p.canCreate}"> Create</label>
<label><input type="checkbox" th:name="|permissions[${i.index}].canRead|" value="true" th:checked="${p.canRead}"> Read</label>
<label><input type="checkbox" th:name="|permissions[${i.index}].canUpdate|" value="true" th:checked="${p.canUpdate}"> Update</label>
<label><input type="checkbox" th:name="|permissions[${i.index}].canDelete|" value="true" th:checked="${p.canDelete}"> Delete</label></article></div>
<button class="comic-btn btn-primary">Save permissions</button></fieldset></form></section></body></html>
