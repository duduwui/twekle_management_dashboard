<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="roleStaffDirectory" class="table-responsive">
<table class="comic-table"><thead><tr><th>Staff member</th><th>Phone</th><th>Access level</th><th>Status</th><th>Permissions</th></tr></thead><tbody>
<tr th:each="admin : ${adminList}"><td th:text="${admin.username}"></td><td th:text="${admin.phoneNumber}"></td><td th:text="${admin.superAdmin ? 'Super administrator' : 'Staff'}"></td><td th:text="${admin.active ? 'Active' : 'Inactive'}"></td><td><a th:href="@{/admin/roles(selectedAdminId=${admin.id},page=${rows.number})}">Configure</a></td></tr>
</tbody></table></div></body></html>
