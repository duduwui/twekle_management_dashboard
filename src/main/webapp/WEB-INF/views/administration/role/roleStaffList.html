<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="roleStaffList" style="margin-bottom: 28px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <h3 style="margin: 0; font-size: 1.05rem; font-weight: 900; color: #0F172A;">
            1. Staff Members Directory (Select to Configure)
        </h3>
        <span style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted);">
            Click any administrator below to view and assign their role
        </span>
    </div>

    <div class="table-responsive">
        <table class="comic-table">
            <thead>
                <tr>
                    <th style="width: 70px;">ID</th>
                    <th>Staff Member</th>
                    <th>Phone Number</th>
                    <th style="width: 130px;">Access Level</th>
                    <th style="width: 100px;">Status</th>
                    <th style="text-align: right; width: 180px;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="adm : ${admins}"
                    th:id="'admin-row-' + ${adm.id}"
                    class="admin-table-row"
                    th:data-admin-id="${adm.id}"
                    th:data-admin-username="${adm.username}"
                    th:data-super-admin="${adm.superAdmin}"
                    onclick="selectAdminFromRow(this)"
                    style="cursor: pointer; transition: background-color 0.15s ease;">
                    <td>
                        <strong style="color: #0F172A;" th:text="'#' + ${adm.id}">#1</strong>
                    </td>
                    <td>
                        <strong style="font-size: 0.96rem; color: #0F172A;" th:text="${adm.username}">twekl_super_admin</strong>
                    </td>
                    <td>
                        <span class="text-muted" style="font-size: 0.88rem;" th:text="${adm.phoneNumber != null ? adm.phoneNumber : '-'}">-</span>
                    </td>
                    <td>
                        <span th:if="${adm.superAdmin}" class="comic-tag tag-primary" style="background-color: #7C3AED; color: #FFFFFF; font-weight: 800;">
                            Super Admin
                        </span>
                        <span th:unless="${adm.superAdmin}" class="comic-tag tag-gray" style="font-weight: 700;">
                            Staff
                        </span>
                    </td>
                    <td>
                        <span th:if="${adm.active}" class="status-pill-btn active" style="cursor: default;">
                            <span class="status-dot"></span>
                            <span>Active</span>
                        </span>
                        <span th:unless="${adm.active}" class="status-pill-btn inactive" style="cursor: default;">
                            <span class="status-dot"></span>
                            <span>Inactive</span>
                        </span>
                    </td>
                    <td style="text-align: right;">
                        <button type="button" class="comic-btn-sm btn-select-admin"
                                onclick="event.stopPropagation(); selectAdminFromRow(this.closest('tr'))">
                            Configure Permissions
                        </button>

                        <!-- Hidden Admin Permissions Payload -->
                        <div style="display: none;" th:id="'perms-data-' + ${adm.id}">
                            <span th:each="p : ${adm.permissions}"
                                  th:data-module="${p.moduleKey}"
                                  th:data-create="${p.canCreate}"
                                  th:data-read="${p.canRead}"
                                  th:data-update="${p.canUpdate}"
                                  th:data-delete="${p.canDelete}">
                            </span>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(admins)}">
                    <td colspan="7" style="text-align: center; padding: 24px; color: var(--text-muted); font-weight: 700;">
                        No administrators found.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
