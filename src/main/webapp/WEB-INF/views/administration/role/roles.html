<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Role Templates | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
    <section class="comic-card page-slide-fade">

        <!-- SSR Flash Messages -->
        <div th:if="${successMessage}" class="comic-alert-success" style="margin-bottom: 16px; padding: 12px 16px; background-color: #ECFDF5; border: 2px solid #059669; border-radius: 8px; color: #065F46; font-weight: 700;" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="comic-alert-danger" style="margin-bottom: 16px; padding: 12px 16px; background-color: #FEF2F2; border: 2px solid #DC2626; border-radius: 8px; color: #991B1B; font-weight: 700;" th:text="${errorMessage}"></div>

        <!-- 2.1 ROLE TEMPLATES DIRECTORY LIST -->
        <div id="roleListSection" style="display: flex; flex-direction: column; gap: 16px;">
            
            <!-- Clean Filter Toolbar -->
            <div class="comic-filter-toolbar">
                <div class="filter-left-controls">
                    <button type="button" class="comic-btn-sm" onclick="showCreateRoleSection()">
                        + Create Role Template
                    </button>
                </div>

                <!-- Fast Filter Input -->
                <div class="filter-search-box">
                    <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="search" id="roleSearchInput" class="comic-search-bar" placeholder="Filter role templates..." oninput="filterRoleTable()">
                </div>
            </div>

            <!-- Server-Side Rendered Roles Table -->
            <div class="table-responsive">
                <table class="comic-table" id="roleTable">
                    <thead>
                        <tr>
                            <th>Role Template Name</th>
                            <th style="text-align: center; width: 100px;">Create (C)</th>
                            <th style="text-align: center; width: 100px;">Read (R)</th>
                            <th style="text-align: center; width: 100px;">Update (U)</th>
                            <th style="text-align: center; width: 100px;">Delete (D)</th>
                            <th style="text-align: right; width: 180px;" class="nowrap">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="role : ${roleList}" class="role-row">
                            <td>
                                <strong style="font-size: 0.96rem; color: var(--primary-dark);" th:text="${role.name}">Role Name</strong>
                            </td>
                            <td style="text-align: center;">
                                <div style="display: flex; justify-content: center;">
                                    <span class="crud-unified-badge" th:classappend="${role.canCreate} ? 'active' : ''">C</span>
                                </div>
                            </td>
                            <td style="text-align: center;">
                                <div style="display: flex; justify-content: center;">
                                    <span class="crud-unified-badge" th:classappend="${role.canRead} ? 'active' : ''">R</span>
                                </div>
                            </td>
                            <td style="text-align: center;">
                                <div style="display: flex; justify-content: center;">
                                    <span class="crud-unified-badge" th:classappend="${role.canUpdate} ? 'active' : ''">U</span>
                                </div>
                            </td>
                            <td style="text-align: center;">
                                <div style="display: flex; justify-content: center;">
                                    <span class="crud-unified-badge" th:classappend="${role.canDelete} ? 'active' : ''">D</span>
                                </div>
                            </td>
                            <td style="text-align: right;" class="nowrap">
                                <div style="display: inline-flex; gap: 8px; align-items: center;">
                                    <button type="button" class="comic-btn-sm" 
                                            th:data-role-id="${role.roleId}"
                                            th:data-role-name="${role.name}"
                                            th:data-can-create="${role.canCreate}"
                                            th:data-can-read="${role.canRead}"
                                            th:data-can-update="${role.canUpdate}"
                                            th:data-can-delete="${role.canDelete}"
                                            onclick="openEditRoleModalFromButton(this)">
                                        Edit
                                    </button>
                                    <form th:action="@{/admin/roles/{roleId}/delete(roleId=${role.roleId})}" method="post" style="display: inline; margin: 0;" onsubmit="return confirm('Are you sure you want to delete this role template?');">
                                        <button type="submit" class="comic-btn-danger" style="cursor: pointer;">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(roleList)}">
                            <td colspan="6" style="text-align: center; padding: 28px; color: var(--text-muted); font-weight: 800;">
                                No role templates configured yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Footer summary -->
            <div class="datatable-footer" th:if="${!#lists.isEmpty(roleList)}">
                <div class="datatable-info">
                    Total Configured Role Templates: <strong th:text="${#lists.size(roleList)}">0</strong>
                </div>
            </div>
        </div>

        <!-- 2.2 CREATE ROLE TEMPLATE SECTION -->
        <div id="createRoleSection" style="display: none; flex-direction: column; gap: 22px;">
            <div class="action-page-header">
                <button type="button" class="back-btn" onclick="hideCreateRoleSection()">
                    ← Back to Role Templates
                </button>
            </div>

            <form th:action="@{/admin/roles/create}" method="post" class="comic-form-box" style="max-width: 640px;" autocomplete="off">
                <div class="form-group" style="margin-bottom: 18px;">
                    <label class="form-label">Role Template Name <span style="color: #EF4444;">*</span></label>
                    <input type="text" name="name" class="comic-input" placeholder="e.g. Inventory Controller" required autocomplete="off">
                </div>

                <div style="margin-bottom: 14px;">
                    <label class="form-label" style="margin-bottom: 10px; display: block;">Permission Matrix:</label>
                    <div style="display: flex; gap: 8px; margin-bottom: 14px;">
                        <button type="button" class="comic-btn-sm" onclick="applyPreset('create', 'full')">Full CRUD</button>
                        <button type="button" class="comic-btn-sm" onclick="applyPreset('create', 'readonly')">Read Only</button>
                        <button type="button" class="comic-btn-sm" onclick="applyPreset('create', 'revoke')">Revoke All</button>
                    </div>

                    <div style="background: #F8FAFC; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 14px 18px; display: flex; flex-direction: column; gap: 12px;">
                        <label class="comic-checkbox-label" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" name="canCreate" id="create_canCreate" value="true">
                            <span><strong>Create (C):</strong> Can create and submit new records</span>
                        </label>
                        <label class="comic-checkbox-label" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" name="canRead" id="create_canRead" value="true" checked>
                            <span><strong>Read (R):</strong> Can view directories and reports</span>
                        </label>
                        <label class="comic-checkbox-label" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" name="canUpdate" id="create_canUpdate" value="true">
                            <span><strong>Update (U):</strong> Can edit existing data and status</span>
                        </label>
                        <label class="comic-checkbox-label" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" name="canDelete" id="create_canDelete" value="true">
                            <span><strong>Delete (D):</strong> Can remove records permanently</span>
                        </label>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 14px;">
                    <button type="button" class="comic-btn-secondary" onclick="hideCreateRoleSection()">Cancel</button>
                    <button type="submit" class="comic-btn">Save &amp; Create Role Template</button>
                </div>
            </form>
        </div>

    </section>

    <!-- 2.3 EDIT ROLE TEMPLATE MODAL -->
    <div id="editRoleModal" class="comic-modal-overlay" style="display: none;" onclick="closeEditRoleModal()">
        <div class="filter-modal-card" style="max-width: 520px;" onclick="event.stopPropagation()">
            <div class="filter-modal-header-simple">
                <strong class="filter-modal-title-simple">Edit Role Template</strong>
                <button type="button" class="comic-modal-close" onclick="closeEditRoleModal()">&times;</button>
            </div>

            <form id="editRoleForm" method="post" autocomplete="off">
                <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Role Template Name <span style="color: #EF4444;">*</span></label>
                        <input type="text" id="edit_role_name" name="name" class="comic-input" required autocomplete="off">
                    </div>

                    <div>
                        <label class="form-label" style="margin-bottom: 8px; display: block;">Permission Matrix:</label>
                        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                            <button type="button" class="comic-btn-sm" onclick="applyPreset('edit', 'full')">Full CRUD</button>
                            <button type="button" class="comic-btn-sm" onclick="applyPreset('edit', 'readonly')">Read Only</button>
                            <button type="button" class="comic-btn-sm" onclick="applyPreset('edit', 'revoke')">Revoke All</button>
                        </div>

                        <div style="background: #F8FAFC; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
                            <label class="comic-checkbox-label" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                                <input type="checkbox" name="canCreate" id="edit_canCreate" value="true">
                                <span><strong>Create (C)</strong></span>
                            </label>
                            <label class="comic-checkbox-label" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                                <input type="checkbox" name="canRead" id="edit_canRead" value="true">
                                <span><strong>Read (R)</strong></span>
                            </label>
                            <label class="comic-checkbox-label" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                                <input type="checkbox" name="canUpdate" id="edit_canUpdate" value="true">
                                <span><strong>Update (U)</strong></span>
                            </label>
                            <label class="comic-checkbox-label" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                                <input type="checkbox" name="canDelete" id="edit_canDelete" value="true">
                                <span><strong>Delete (D)</strong></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="filter-modal-footer-simple">
                    <button type="button" class="comic-btn-secondary" onclick="closeEditRoleModal()">Cancel</button>
                    <button type="submit" class="comic-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Client-Side UI & Filter Script -->
    <script>
    function filterRoleTable() {
        var input = document.getElementById("roleSearchInput");
        var filter = input.value.toLowerCase();
        var rows = document.querySelectorAll("#roleTable tbody tr.role-row");
        rows.forEach(function(row) {
            var text = row.innerText.toLowerCase();
            row.style.display = text.indexOf(filter) > -1 ? "" : "none";
        });
    }

    function showCreateRoleSection() {
        document.getElementById("roleListSection").style.display = "none";
        document.getElementById("createRoleSection").style.display = "flex";
    }

    function hideCreateRoleSection() {
        document.getElementById("createRoleSection").style.display = "none";
        document.getElementById("roleListSection").style.display = "flex";
    }

    function openEditRoleModalFromButton(btn) {
        var roleId = btn.getAttribute("data-role-id");
        var roleName = btn.getAttribute("data-role-name");
        var canCreate = btn.getAttribute("data-can-create") === "true";
        var canRead = btn.getAttribute("data-can-read") === "true";
        var canUpdate = btn.getAttribute("data-can-update") === "true";
        var canDelete = btn.getAttribute("data-can-delete") === "true";

        document.getElementById("editRoleForm").action = "/admin/roles/" + roleId + "/update";
        document.getElementById("edit_role_name").value = roleName || "";
        document.getElementById("edit_canCreate").checked = canCreate;
        document.getElementById("edit_canRead").checked = canRead;
        document.getElementById("edit_canUpdate").checked = canUpdate;
        document.getElementById("edit_canDelete").checked = canDelete;
        document.getElementById("editRoleModal").style.display = "flex";
    }

    function closeEditRoleModal() {
        document.getElementById("editRoleModal").style.display = "none";
    }

    function applyPreset(formPrefix, type) {
        var createCb = document.getElementById(formPrefix + "_canCreate");
        var readCb = document.getElementById(formPrefix + "_canRead");
        var updateCb = document.getElementById(formPrefix + "_canUpdate");
        var deleteCb = document.getElementById(formPrefix + "_canDelete");

        if (type === "full") {
            createCb.checked = true;
            readCb.checked = true;
            updateCb.checked = true;
            deleteCb.checked = true;
        } else if (type === "readonly") {
            createCb.checked = false;
            readCb.checked = true;
            updateCb.checked = false;
            deleteCb.checked = false;
        } else if (type === "revoke") {
            createCb.checked = false;
            readCb.checked = false;
            updateCb.checked = false;
            deleteCb.checked = false;
        }
    }
    </script>
    </div>
</body>
</html>
