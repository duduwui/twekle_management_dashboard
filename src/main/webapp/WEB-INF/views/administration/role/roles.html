<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Admin Roles &amp; Permissions | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
    <section class="comic-card page-slide-fade">

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="comic-alert-success" style="margin-bottom: 16px; padding: 12px 16px; background-color: #ECFDF5; border: 2px solid #059669; border-radius: 8px; color: #065F46; font-weight: 700;" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="comic-alert-danger" style="margin-bottom: 16px; padding: 12px 16px; background-color: #FEF2F2; border: 2px solid #DC2626; border-radius: 8px; color: #991B1B; font-weight: 700;" th:text="${errorMessage}"></div>

        <!-- Section Header -->
        <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 24px;">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
                <div>
                    <h2 class="card-title" style="margin: 0;">Admin Roles &amp; Permissions Assignment</h2>
                    <span class="card-subtitle" style="font-size: 0.88rem; color: var(--text-muted); font-weight: 600;">
                        Select an administrator to configure CRUD permissions across core modules.
                    </span>
                </div>
            </div>
        </div>

        <!-- 1. ADMINISTRATOR STAFF DIRECTORY TABLE FRAGMENT -->
        <div th:replace="~{administration/role/roleStaffDirectory :: roleStaffDirectory}"></div>

        <!-- 2. PERMISSIONS ASSIGNMENT PANEL FRAGMENT -->
        <div th:replace="~{administration/role/rolePermissions :: rolePermissions}"></div>

    </section>

    <!-- Client-Side UI & Interactive Matrix Controller Script -->
    <script src="/js/role/roleUi.js"></script>
    </div>
</body>
</html>
