<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Existing Dynamic Filter Rules Directory Fragment -->
<div th:fragment="timeFilterDirectory" style="display: flex; flex-direction: column; gap: 14px; margin-top: 6px;">
    <div class="comic-filter-toolbar">
        <div style="font-size: 1.05rem; font-weight: 900;">Active &amp; Configured Filter Rules:</div>
        <div class="filter-search-box">
            <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="presetSearchInput" class="comic-search-bar" placeholder="Filter this page..." oninput="filterPresetTable()">
        </div>
    </div>

    <div class="table-responsive">
        <table class="comic-table" id="presetTable">
            <thead>
                <tr>
                    <th style="width: 100px;">Rule ID</th>
                    <th>Filter Name</th>
                    <th>Duration Period</th>
                    <th>Status</th>
                    <th style="text-align: right; width: 120px;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="preset : ${presetList}" class="preset-row">
                    <td>
                        <strong style="color: var(--primary-dark);" th:text="'#' + ${preset.presetId}">#1</strong>
                    </td>
                    <td>
                        <strong style="font-size: 0.95rem;" th:text="${preset.labelEn}">Last 24 Hours</strong>
                    </td>
                    <td>
                        <span style="font-weight: 700; color: var(--text-muted);" th:text="${preset.durationValue + ' ' + preset.durationUnit}">24 HOURS</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/timelines/{presetId}/toggle_status(presetId=${preset.presetId})}" method="post" style="display: inline-flex; align-items: center; margin: 0;">
                            <button type="submit" th:disabled="${!@portalAccess.allows('TIMELINES_PRESETS','UPDATE')}" class="status-pill-btn" th:classappend="${preset.active} ? 'active' : 'inactive'" th:title="'Click to toggle status'">
                                <span class="status-dot"></span>
                                <span th:text="${preset.active} ? 'Active' : 'Inactive'">Active</span>
                            </button>
                        </form>
                    </td>
                    <td style="text-align: right;">
                        <form th:action="@{/admin/timelines/{presetId}/delete_preset(presetId=${preset.presetId})}" method="post" style="display: inline; margin: 0;" onsubmit="return confirm('Are you sure you want to delete this preset rule?');">
                            <button type="submit" th:disabled="${!@portalAccess.allows('TIMELINES_PRESETS','DELETE')}" class="comic-btn-danger" style="cursor: pointer;">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(presetList)}">
                    <td colspan="5" style="text-align: center; padding: 24px; color: var(--text-muted); font-weight: 800;">
                        No custom filter rules configured yet.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="datatable-footer" th:if="${!#lists.isEmpty(presetList)}">
        <div class="datatable-info">
            Total Configured Presets: <strong th:text="${rows.totalElements}">0</strong>
        </div>
    </div>
</div>
</body>
</html>
