<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Create New Dynamic Time Filter Form Fragment -->
<form th:fragment="timeFilterForm" th:if="${@portalAccess.allows('TIMELINES_PRESETS','CREATE')}" th:action="@{/admin/timelines/create_preset}" method="post" class="comic-form-box" autocomplete="off">
    <div style="font-size: 0.98rem; font-weight: 900; margin-bottom: 12px; color: var(--primary-dark);">
        Create New Time Filter Preset:
    </div>
    <div class="form-grid-3">
        <div class="form-group">
            <label class="form-label">Rule Display Name <span style="color: #EF4444;">*</span></label>
            <input type="text" name="labelEn" class="comic-input" placeholder="e.g. Last 48 Hours" required autocomplete="off">
        </div>
        <div class="form-group">
            <label class="form-label">Duration Value <span style="color: #EF4444;">*</span></label>
            <input type="number" name="durationValue" class="comic-input" placeholder="e.g. 48" min="1" value="1" required>
        </div>
        <div class="form-group">
            <label class="form-label">Duration Unit</label>
            <select name="durationUnit" class="comic-input">
                <option value="HOURS">Hours</option>
                <option value="DAYS" selected>Days</option>
                <option value="WEEKS">Weeks</option>
                <option value="MONTHS">Months</option>
            </select>
        </div>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 14px;">
        <button type="submit" class="comic-btn">+ Add Time Filter Preset</button>
    </div>
</form>
</body>
</html>
