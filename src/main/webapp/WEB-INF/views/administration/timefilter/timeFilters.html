<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{administration/fragments/adminLayout}">
<head>
    <title>Time Filters &amp; Presets | Twekl Administration</title>
</head>
<body>
    <div layout:fragment="content">
    <section class="comic-card page-slide-fade">

        <!-- SSR Flash Messages -->
        <div th:if="${successMessage}" class="comic-alert-success" style="margin-bottom: 16px; padding: 12px 16px; background-color: #ECFDF5; border: 2px solid #059669; border-radius: 8px; color: #065F46; font-weight: 700;" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="comic-alert-danger" style="margin-bottom: 16px; padding: 12px 16px; background-color: #FEF2F2; border: 2px solid #DC2626; border-radius: 8px; color: #991B1B; font-weight: 700;" th:text="${errorMessage}"></div>

        <div style="display: flex; flex-direction: column; gap: 20px;">
            
            <!-- Header banner -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; border-bottom: 2px solid var(--border-black); padding-bottom: 14px;">
                <div>
                    <h2 style="font-size: 1.2rem; font-weight: 900; color: #0F172A; margin: 0 0 4px 0;">Time Filter Presets &amp; Milestone Rules</h2>
                    <p style="font-size: 0.85rem; color: #64748B; margin: 0; font-weight: 600;">
                        Configure operational time filter presets, recency intervals, and automated checkpoint milestones used across customer follow-ups and reports.
                    </p>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="comic-tag tag-primary" style="font-size: 0.82rem; padding: 4px 10px;">
                        Total Rules: <strong th:text="${#lists.size(presetList)}">0</strong>
                    </span>
                </div>
            </div>

            <!-- Create New Dynamic Time Filter Form Component -->
            <th:block th:replace="~{administration/timefilter/presetForm :: presetForm}"></th:block>

            <!-- Existing Dynamic Filter Rules Directory Component -->
            <th:block th:replace="~{administration/timefilter/presetList :: presetList}"></th:block>

        </div>
    </section>
    </div>
</body>
</html>
